  ];
  let method='mpesa',wd=null,phase='form';
  const M=()=>METHODS.find(m=>m.id===method);
  const feeOf=m=>m==='card'?0:{mpesa:1,usdt:1,btc:2,eth:1.5}[m];
  const feeOfAmt=a=>method==='card'?+(a*0.015).toFixed(2):feeOf(method);
  function recentHTML(list){
    if(!list.length)return '';
    return `<div class="pn"><label class="hint" style="font-weight:700;color:var(--mut);text-transform:uppercase;font-size:10px;letter-spacing:.08em">Recent withdrawals</label>
      <table class="tbl"><tr><th>Time</th><th>Method</th><th>Amount</th><th>Status</th></tr>
      ${list.map(w=>`<tr><td class="mono" style="font-size:11px">${fmtDT(w.time)}</td>
        <td>${w.method.toUpperCase()}</td><td class="mono">${money(w.amount)}</td>
        <td><span class="badge ${w.status==='processed'?'done':'pend'}">${w.status==='processed'?'SENT':'PROCESSING'}</span></td></tr>`).join('')}
      </table></div>`;
  }
  function draw(){
    app.innerHTML=shell('/withdraw',`<div class="pg"><div class="pg-head"><h1>Withdraw</h1></div><div id="w-body"></div></div>`);
    wireShell();
    (async()=>{
      const txs=await API.listTx();
      const body=$('#w-body');
      if(phase==='form'){
        const bal=Auth.u?Auth.u.wallets.real:0;
        body.innerHTML=`<div class="pn">
        <label class="hint" style="font-weight:700;color:var(--mut);text-transform:uppercase;font-size:10px;letter-spacing:.08em;margin:0 0 8px">Payout method</label>
        ${METHODS.map(m=>`<button class="mrow ${m.id===method?'on':''}" data-m="${m.id}">
          <span class="mg">${m.id==='card'?icon('card',17):{mpesa:'M',usdt:'₮',btc:'₿',eth:'Ξ'}[m.id]}</span>
          <span><b>${m.name}</b><i>${m.id==='mpesa'?'to your Safaricom number':m.id==='card'?'fee 1.5%':'fee '+money(m.fee)}</i></span></button>`).join('')}
        <label class="hint" style="font-weight:700;color:var(--mut);font-size:12px;margin:12px 0 4px">Amount (USD) · available ${money(bal)}</label>
        <input id="w-amt" inputmode="decimal" placeholder="50.00">
        <div class="qchips">${[25,50,100,250].map(v=>`<button data-q="${v}">${v}</button>`).join('')}<button data-q="max">MAX</button></div>
        <label class="hint" style="font-weight:700;color:var(--mut);font-size:12px;margin:10px 0 4px">${method==='mpesa'?'M-Pesa phone number':'Payout address'}</label>
        <input id="w-addr" placeholder="${M().ph}">
        <div class="sum-r" style="margin-top:10px"><span>Fee</span><b id="w-fee">—</b></div>
        ${method==='mpesa'?`<div class="sum-r"><span>Approx. M-Pesa credit</span><b id="w-kes">—</b></div>`:''}
        <div class="sum-r tot"><span>You receive</span><b id="w-net">—</b></div>
        <button class="btn btn-up wide" id="w-go" style="margin-top:12px">${icon('send',14)} Request withdrawal</button>
      </div>${recentHTML(txs.filter(t=>t.type==='withdrawal').slice(0,5))}`;
        wireForm();
      }else if(phase==='track'){
        body.innerHTML=`<div class="pn"><h3 style="font-size:15px;margin-bottom:4px">Withdrawing ${money(wd.amount)} via ${wd.method.toUpperCase()}</h3>
          <p class="hint" style="margin:0 0 12px">To <b>${esc(wd.address.length>22?wd.address.slice(0,10)+'…'+wd.address.slice(-6):wd.address)}</b></p>
          <div id="wst"></div></div>`;
        const st=['Request submitted','Compliance approved',wd.method==='mpesa'?'Sending M-Pesa (B2C)':'Broadcasting payment','Sent'];
        (async()=>{for(let i=0;i<st.length;i++){
          $('#wst').innerHTML=st.map((n,j)=>
            `<div class="stg ${j<i?'done':j===i?'run':''}">${icon(j<i?'check':'clock',14)}<span>${n}</span>${j===i?'<i class="spin"></i>':''}</div>`).join('');
          await sleep(i===2?3500:2000);}
          phase='done';draw();})();
      }else{
        body.innerHTML=`<div class="pn" style="text-align:center;padding:34px 16px">
          <div class="big-check">${icon('check',26)}</div>
          <h3 style="font-size:17px;margin-bottom:4px">${money(wd.total)} sent</h3>
          <p class="hint" style="margin:0 0 16px">${money(wd.amount)} + ${money(wd.fee)} fee via ${wd.method.toUpperCase()}.</p>
          <button class="btn btn-up big" id="w-again">New withdrawal</button></div>
          ${recentHTML(txs.filter(t=>t.type==='withdrawal').slice(0,5))}`;
        $('#w-again').onclick=()=>{phase='form';wd=null;draw()};
      }
    })();
  }
  function wireForm(){
    $$('.mrow',app).forEach(b=>b.onclick=()=>{method=b.dataset.m;draw()});
    $$('.qchips button[data-q]',app).forEach(b=>b.onclick=()=>{
      if(b.dataset.q==='max'){const bal=Auth.u.wallets.real;
        $('#w-amt').value=Math.max(0,Math.floor((method==='card'?bal/1.015:bal-feeOf(method))*100)/100);}
      else $('#w-amt').value=b.dataset.q;calc()});
    const calc=()=>{const a=parseFloat($('#w-amt').value)||0,f=feeOfAmt(a);
      $('#w-fee').textContent=money(f);
      $('#w-net').textContent=money(Math.max(0,a-f));
      const kes=$('#w-kes');if(kes)kes.textContent='KES '+Math.ceil((a-f)*KES_PER_USD).toLocaleString();};
    $('#w-amt').oninput=calc;calc();
    $('#w-go').onclick=async()=>{
      const a=parseFloat($('#w-amt').value)||0,addr=$('#w-addr').value.trim(),f=feeOfAmt(a);
      if(!(a>=10))return toast('warn','Too small','Minimum withdrawal is $10.00.');
      const okY=await confirmDialog({title:'Confirm withdrawal',danger:true,ok:'Send it',
        body:`Send <b>${money(a)}</b> via ${method.toUpperCase()}${method==='mpesa'?` (≈ KES ${Math.ceil((a-f)*KES_PER_USD).toLocaleString()})`:''}<br>To: <b style="word-break:break-all">${esc(addr)}</b><br><br>Fee <b>${money(f)}</b> · you receive <b>${money(a-f)}</b>. Can't be reversed.`});
      if(!okY)return;
      try{wd=await API.createWithdrawal({method,address:addr,amount:a});
        Auth.bump('real',-wd.total);
        toast('ok','Withdrawal submitted',`${money(wd.total)} deducted.`);
        phase='track';draw();
      }catch(e){toast('warn','Withdrawal rejected',e.message)}
    };
  }
  draw();
}

/* ═══ ACCA ═══ */
function Acca(app){
  let legs=[],exp=120;
  function draw(){
    const mult=legs.reduce((s,l)=>s*(1+Market.byId(l.asset).payout/100),1);
    const amt=parseFloat($('#amt')?.value)||10;
    app.innerHTML=shell('/acca',`<div class="pg">
    <div class="pg-head"><h1>${icon('layers',19)} Accumulator</h1></div>
    <div class="pn">
      <p class="hint" style="margin:0 0 12px">Stack <b>2–5</b> UP/DOWN calls. Every leg must land — one miss loses the ticket. Payouts multiply.</p>
      ${legs.length<5?`<label class="hint" style="font-weight:700;color:var(--mut);text-transform:uppercase;font-size:10px;letter-spacing:.08em;margin:0 0 8px">Add a market</label>
      <div class="chips wide" id="ac-mk">${Market.A.filter(a=>!legs.some(l=>l.asset===a.id))
        .map(a=>`<button data-a="${a.id}">${a.name}</button>`).join('')}</div>`:''}
      <div id="ac-legs" style="margin-top:12px">
        ${legs.map((l,i)=>{const a=Market.byId(l.asset);return `
        <div class="leg"><span style="flex:1"><b>${a.name}</b><i>${a.payout}% leg</i></span>
          <span class="dirpick">
            <button data-i="${i}" data-d="up" class="${l.dir==='up'?'on up':''}">▲ UP</button>
            <button data-i="${i}" data-d="down" class="${l.dir==='down'?'on down':''}">▼ DOWN</button></span>
          <button data-rm="${i}" style="background:none;border:0;color:var(--dim);cursor:pointer;padding:4px">${icon('x',14)}</button>
        </div>`}).join('')||`<div class="empty" style="padding:12px">${icon('layers',18)}<p style="font-size:12px">No legs yet — add 2–5 markets</p></div>`}
      </div>
      <label class="hint" style="font-weight:700;color:var(--mut);font-size:12px;margin:12px 0 4px">Amount</label>
      <input id="amt" inputmode="decimal" value="10">
      <div class="qchips">${[5,10,25,50,100].map(v=>`<button data-q="${v}">${v}</button>`).join('')}</div>
      <div class="erow" style="margin-left:0;margin-right:0">${[['60','1m'],['120','2m'],['300','5m']]
        .map(([v,l])=>`<button data-x="${v}" class="${+v===exp?'on':''}">${l}</button>`).join('')}</div>
      <div class="sum-r" style="margin-top:10px"><span>Combined multiplier</span><b class="mono" id="ac-mult">${mult.toFixed(2)}×</b></div>
      <div class="sum-r tot"><span>Profit if all land</span><b class="mono u-c" id="ac-pr">+${money(amt*(mult-1))}</b></div>
      <button class="btn btn-up wide big" id="ac-go" style="margin-top:12px">Place accumulator</button>
    </div>
    <div class="pn"><label class="hint" style="font-weight:700;color:var(--mut);text-transform:uppercase;font-size:10px;letter-spacing:.08em">Recent accumulators</label><div id="ac-res">
      <div class="empty" style="padding:16px">${icon('clock',18)}<p style="font-size:12px">Loading…</p></div></div></div>
    </div>`);
    wireShell();wire();
  }
  function upd(){
    const mult=legs.reduce((s,l)=>s*(1+Market.byId(l.asset).payout/100),1);
    const amt=parseFloat($('#amt')?.value)||0;
    const me=$('#ac-mult');if(me)me.textContent=mult.toFixed(2)+'×';
    const pe=$('#ac-pr');if(pe)pe.textContent='+'+money(amt*(mult-1));
  }
  function results(list){
    const el=$('#ac-res');if(!el)return;
    const ac=list.filter(t=>t.kind==='acc').slice(0,10);
    el.innerHTML=ac.length?ac.map(t=>`
      <div class="pos-r">
        <span class="dir ${t.result==='win'?'up':'down'}">${t.result==='win'?'✓':t.result==='loss'?'✕':'='}</span>
        <span class="pos-i"><b>ACCA ×${t.legs?t.legs.length:'?'}</b><i class="mono">${(t.legs||[]).map(l=>Market.byId(l.asset)?.name||l.asset).join(' · ')}</i></span>
        <span class="pos-s ${t.result==='win'?'w':t.result==='loss'?'l':'w'}">${t.result==='win'?'+'+money(t.profit):t.result==='loss'?'−'+money(t.amount):'refund'}</span>
        <span class="pos-t mono">${fmtDT(t.closeTime||t.entryTime).slice(0,6)}</span></div>`).join('')
    :`<div class="empty" style="padding:16px">${icon('layers',18)}<p style="font-size:12px">No accumulators yet</p></div>`;
  }
  async function loadRes(){try{results(await API.listTrades())}catch{results([])}}
  function wire(){
    $('#ac-mk')&&($('#ac-mk').onclick=e=>{const b=e.target.closest('button');if(!b)return;
      if(legs.length>=5)return toast('warn','Maximum 5 legs');
      legs.push({asset:b.dataset.a,dir:'up'});draw();});
    const lg=$('#ac-legs');
    if(lg)lg.onclick=e=>{
      const rm=e.target.closest('[data-rm]');
      if(rm){legs.splice(+rm.dataset.rm,1);draw();return;}
      const d=e.target.closest('[data-d]');
      if(d){legs[+d.dataset.i].dir=d.dataset.d;draw();}};
    const setAmt=v=>{const i=$('#amt');i.value=Math.round(clamp(v,MIN_STAKE,100000)*100)/100;upd()};
    $('#amt').oninput=upd;
    $$('.qchips button[data-q]',app).forEach(b=>b.onclick=()=>setAmt(+b.dataset.q));
    $$('.erow button',app).forEach(b=>b.onclick=()=>{exp=+b.dataset.x;
      $$('.erow button',app).forEach(x=>x.classList.toggle('on',x===b))});
    $('#ac-go').onclick=async()=>{
      if(!requireAuth())return;
      if(legs.length<2)return toast('warn','Not enough legs','Add at least 2 markets.');
      if(!Market.connected)return toast('warn','Connecting…','Waiting for live prices.');
      const amt=parseFloat($('#amt').value),bal=Auth.bal();
      if(!(amt>=MIN_STAKE))return toast('warn','Stake too small','Minimum stake is $'+MIN_STAKE.toFixed(2)+'.');
      if(amt>bal)return toast('warn','Not enough balance',`Your ${Auth.acc.toUpperCase()} wallet holds ${money(bal)}.`);
      const b=$('#ac-go');b.classList.add('busy');
      try{
        const t=await API.placeTrade({kind:'acc',legs:legs.map(l=>({asset:l.asset,dir:l.dir})),
          amount:amt,expirySec:exp,account:Auth.acc});
        Auth.bump(t.account,-amt);
        toast('info',`ACCA ×${legs.length} · ${money(amt)}`,
          legs.map(l=>Market.byId(l.asset).name+' '+l.dir.toUpperCase()).join(' · '));
        loadRes();Bus.emit('trades');
      }catch(e){toast('warn','Order rejected',e.message)}
      b.classList.remove('busy');
    };
    upd();loadRes();
    onCleanup(Market.on(upd));
  }
  draw();
}

    const pl = trades.reduce(
      (s, t) => s + Number(t.profit || 0), 0
    );

    const vol = trades.reduce(
      (s, t) => s + Number(t.amount || 0), 0
    );

    $('#ps-n').textContent = trades.length;

    $('#ps-w').textContent =
      (trades.length ? Math.round(w / trades.length * 100) : 0) + '%';

    const pe = $('#ps-p');

    pe.textContent =
      (pl >= 0 ? '+' : '−') +
      money(Math.abs(pl)).slice(1);

    pe.className = pl >= 0 ? 'u-c' : 'd-c';

    $('#ps-v').textContent = money(vol);

    console.error('Profile statistics error:', err);

    $('#ps-w').textContent = '—';
    $('#ps-p').textContent = '—';
    $('#ps-v').textContent = '—';

}

/* ═══════════════════════════════════════
   VANTA — ADVANCED APPLICATION ROUTER
═══════════════════════════════════════ */

const routes = {
  '/': DigitTerminal,
  '/markets': MarketsPage,
  '/classic': ClassicTerminal,
  '/acca': Acca,
  '/scanner': Scanner,
  '/support': Support,
  '/deposit': Deposit,
  '/withdraw': Withdraw,
  '/positions': Positions,
  '/history': Positions,
  '/profile': Profile,
  '/referrals': Referrals
};

/* ROUTE ACCESS CONTROL */
const guarded = [
  '/deposit',
  '/withdraw',
  '/positions',
  '/history',
  '/profile',
  '/acca',
  '/referrals'
];

/* ROUTE ALIASES */
const aliases = {
  '/home': '/',
  '/trade': '/',
  '/refer': '/referrals',
  '/invite': '/referrals'
};

let routeVersion = 0;
let appReady = false;

/* CLEANUP */
function cleanupRoute() {
  cleanups.forEach(fn => {
    try {
      if (typeof fn === 'function') fn();
    } catch (e) {
      console.warn('Cleanup error:', e);
    }
  });

  cleanups = [];
}

/* ROUTE RESOLUTION */
function getCurrentRoute() {
  const hash = location.hash || '#/';
  let path = hash.slice(1).split('?')[0];

  if (!path.startsWith('/')) path = '/' + path;

  path = aliases[path] || path;

  return path;
}

/* LOADING SCREEN */
function showRouteLoading(app) {
  app.innerHTML = `
    <div style="
      min-height:55vh;
      display:grid;
      place-items:center;
      color:var(--mut);
      text-align:center;
    ">
      <div>
        <div style="
          width:32px;
          height:32px;
          border:3px solid rgba(46,229,138,.15);
          border-top-color:#2EE58A;
          border-radius:50%;
          animation:vantaSpin .8s linear infinite;
          margin:0 auto 14px;
        "></div>
        <div style="font-size:12px">
          Loading VANTA...
        </div>
      </div>
    </div>

    <style>
      @keyframes vantaSpin {
        to { transform:rotate(360deg); }
      }
    </style>
  `;
}

/* MAIN RENDERER */
async function render() {

  const version = ++routeVersion;

  cleanupRoute();

  const path = getCurrentRoute();
  const app = $('#app');

  if (!app) return;

  /* AUTHENTICATION CHECK */
  if (guarded.includes(path) && !Auth.u) {
    openAuth('register');
    location.hash = '#/';
    return;
  }

  /* PAGE LOADING */
  window.scrollTo({
    top: 0,
    behavior: 'instant'
  });

  showRouteLoading(app);

  try {

    const page = routes[path] || DigitTerminal;

    await Promise.resolve(page(app));

    /* Ignore outdated route results */
    if (version !== routeVersion) return;

    appReady = true;

  } catch (error) {

    if (version !== routeVersion) return;

    console.error('VANTA page error:', error);

    app.innerHTML = `
      <div class="pg">
        <div class="pn" style="
          padding:25px;
          text-align:center;
          border:1px solid rgba(255,90,110,.2);
        ">
          <div style="
            font-size:30px;
            color:#FF5A6E;
            margin-bottom:12px;
          ">!</div>

          <h3>Unable to load page</h3>

          <p class="hint">
            Something went wrong while opening this section.
          </p>

          <button class="btn btn-up" id="v-retry">
            Try again
          </button>

          <a class="btn btn-ghost" href="#/">
            Return home
          </a>
        </div>
      </div>
    `;

    const retry = $('#v-retry');
    if (retry) retry.onclick = render;
  }
}

/* NAVIGATION LISTENER */
window.addEventListener('hashchange', render);

/* INITIAL APPLICATION STARTUP */
(async function boot() {

  try {

    await Auth.boot();

    await render();

    console.log('VANTA initialized successfully');

  } catch (error) {

    console.error('VANTA startup error:', error);

    const app = $('#app');

    if (app) {
      app.innerHTML = `
        <div style="
          padding:25px;
          color:#FF5A6E;
          font-family:monospace;
        ">
          <h3>VANTA Startup Error</h3>
          <p>Unable to initialize your application.</p>
          <button onclick="location.reload()">
            Reload application
          </button>
        </div>
      `;
    }
  }

})();

</script>
