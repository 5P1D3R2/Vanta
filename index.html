<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>VANTA · Trading Terminal</title>
<link rel="icon" href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><rect x="5.5" y="5" width="5" height="11" rx="1" fill="%230ECB81"/><rect x="14" y="7" width="5" height="8" rx="1" fill="%23EAECEF"/></svg>'>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
<style>
:root{
  --bg:#0B0E11; --panel:#141A21; --panel2:#1B232C; --line:#232C36; --line2:#2E3A47;
  --text:#EAECEF; --mut:#848E9C; --dim:#5E6673;
  --up:#0ECB81; --down:#F6465D; --acc:#0ECB81; --gold:#F0B90B;
  --fd:'Inter',sans-serif; --fb:'Inter',sans-serif; --fm:'JetBrains Mono',monospace;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font:400 14px/1.5 var(--fb);-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
.mono{font-family:var(--fm)}
.u-c{color:var(--up)!important}.d-c{color:var(--down)!important}
.ic{flex:none;vertical-align:-3px}
::placeholder{color:var(--dim)}
input,select{font:500 14px var(--fm);color:var(--text);background:var(--panel2);border:1px solid var(--line2);border-radius:8px;padding:11px 12px;outline:0;width:100%}
input:focus{border-color:var(--acc)}
h1,h2,h3{font-weight:700;margin:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;font:600 13.5px var(--fb);padding:11px 16px;border-radius:8px;border:0;cursor:pointer;color:inherit;transition:filter .15s,transform .1s;white-space:nowrap}
.btn:active{transform:scale(.97)}
.btn-up{background:var(--up);color:#fff}.btn-up:hover{filter:brightness(1.1)}
.btn-dn{background:var(--down);color:#fff}.btn-dn:hover{filter:brightness(1.1)}
.btn-ghost{background:var(--panel2);border:1px solid var(--line2)}
.btn-ghost:hover{border-color:var(--mut)}
.btn-gold{background:var(--gold);color:#1E1E1E;font-weight:700}.btn-gold:hover{filter:brightness(1.08)}
.btn.wide{width:100%}.btn.big{padding:14px 22px;font-size:15px}.btn.sm{padding:8px 12px;font-size:12px}
.btn.busy{pointer-events:none;opacity:.55}
.chips{display:inline-flex;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:3px;gap:2px}
.chips button{border:0;background:none;color:var(--mut);font:600 12px var(--fb);padding:7px 11px;border-radius:6px;cursor:pointer}
.chips button.on{background:rgba(14,203,129,.14);color:var(--up)}
.chips.wide{display:flex}.chips.wide button{flex:1}
.qchips{display:flex;gap:6px;margin:8px 0}
.qchips button{flex:1;font:600 12px var(--fm);padding:8px 0;background:var(--panel2);border:1px solid var(--line);border-radius:7px;color:var(--mut);cursor:pointer}
.qchips button:hover{color:var(--up);border-color:rgba(14,203,129,.4)}
.fld{display:block;margin-bottom:13px}
.fld>span:first-child{display:block;font-size:11px;color:var(--mut);margin-bottom:6px;font-weight:600}
.pw{position:absolute;right:8px;top:8px;background:none;border:0;color:var(--dim);cursor:pointer;display:flex;padding:4px}
.err{display:block;color:var(--down);font-size:11.5px;margin-top:4px;font-style:normal}
#toasts{position:fixed;top:12px;right:12px;z-index:600;display:flex;flex-direction:column;gap:8px;width:min(360px,calc(100vw - 24px))}
.toast{display:flex;gap:10px;background:var(--panel);border:1px solid var(--line2);border-left:3px solid var(--mut);border-radius:8px;padding:11px 12px;box-shadow:0 12px 30px rgba(0,0,0,.5);animation:tin .2s}
.toast b{font-size:13px}.toast p{margin:2px 0 0;font-size:11.5px;color:var(--mut);line-height:1.45}
.toast .t-ic{color:var(--mut);margin-top:1px}
.toast.win{border-left-color:var(--up)}.toast.win .t-ic{color:var(--up)}
.toast.loss{border-left-color:var(--down)}.toast.loss .t-ic{color:var(--down)}
.toast.ok{border-left-color:var(--gold)}.toast.ok .t-ic{color:var(--gold)}
.toast .t-x{margin-left:auto;background:none;border:0;color:var(--dim);cursor:pointer;padding:2px}
.toast.out{animation:tout .2s forwards}
@keyframes tin{from{transform:translateX(30px);opacity:0}}
@keyframes tout{to{transform:translateX(30px);opacity:0}}
/* top bar */
.top{height:52px;display:flex;align-items:center;gap:10px;padding:0 12px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:90}
.brand{display:inline-flex;align-items:center;gap:8px;font:800 15px var(--fd);letter-spacing:.06em}
.tnav{display:flex;gap:2px;margin-left:8px}
.tnav a{color:var(--mut);font:600 13px var(--fb);padding:8px 12px;border-radius:7px}
.tnav a:hover{color:var(--text);background:var(--panel2)}
.tnav a.on{color:var(--up);background:rgba(14,203,129,.1)}
.tr{margin-left:auto;display:flex;align-items:center;gap:8px}
.wpill{position:relative}
.wp-btn{display:flex;align-items:center;gap:7px;background:var(--panel2);border:1px solid var(--line2);border-radius:8px;padding:6px 10px;cursor:pointer;color:var(--text)}
.wp-tag{font:700 9px var(--fb);letter-spacing:.08em;padding:3px 6px;border-radius:4px;background:rgba(240,185,11,.15);color:var(--gold)}
.wp-tag.r{background:rgba(14,203,129,.15);color:var(--up)}
.wp-bal{font-size:13.5px;font-weight:700}
.wp-bal.bump{animation:bump .5s}
@keyframes bump{30%{transform:scale(1.12);color:var(--gold)}}
.deposit-btn{background:var(--up);color:#fff;font-weight:700}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--panel2);border:1px solid var(--line2);display:flex;align-items:center;justify-content:center;font:700 13px var(--fd);color:var(--gold);cursor:pointer}
.drop{position:absolute;top:calc(100% + 6px);right:0;background:var(--panel);border:1px solid var(--line2);border-radius:10px;padding:6px;min-width:220px;z-index:95;box-shadow:0 16px 40px rgba(0,0,0,.55)}
.drop-it{display:flex;width:100%;align-items:center;gap:9px;padding:9px 10px;border:0;background:none;color:var(--text);font:500 13px var(--fb);border-radius:7px;cursor:pointer;text-align:left}
.drop-it:hover{background:var(--panel2)}
.drop-it.sel{background:rgba(14,203,129,.08)}
.drop-it.danger{color:var(--down)}
.drop-sep{height:1px;background:var(--line);margin:5px 4px}
.um-head{padding:8px 10px;border-bottom:1px solid var(--line);margin-bottom:5px}
.um-head b{display:block;font-size:13px}.um-head span{font-size:11.5px;color:var(--mut)}
/* bottom nav mobile */
.bnav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--panel);border-top:1px solid var(--line);z-index:88;padding-bottom:env(safe-area-inset-bottom)}
.bnav a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 7px;color:var(--dim);font:600 9.5px var(--fb)}
.bnav a.on{color:var(--up)}
/* terminal shell */
.shell{display:grid;grid-template-columns:250px minmax(0,1fr) 300px;height:calc(100dvh - 52px)}
.aside{border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.aside-search{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line);color:var(--dim)}
.aside-search input{border:0;background:none;padding:4px 0;font-size:12.5px}
.atabs{display:flex;gap:2px;padding:8px 10px;border-bottom:1px solid var(--line)}
.atabs button{flex:1;border:0;background:none;color:var(--mut);font:600 11.5px var(--fb);padding:6px 0;border-radius:6px;cursor:pointer}
.atabs button.on{background:var(--panel2);color:var(--up)}
.alist{overflow:auto;flex:1;padding-bottom:20px}
.ai{display:grid;grid-template-columns:1fr auto;gap:8px;width:100%;padding:10px 12px;background:none;border:0;border-left:2px solid transparent;color:var(--text);cursor:pointer;text-align:left}
.ai:hover{background:var(--panel)}
.ai.on{background:var(--panel);border-left-color:var(--up)}
.ai b{display:block;font-size:12.5px}
.ai i{font-style:normal;font-size:10px;color:var(--dim)}
.ai-pr{text-align:right}
.ai-p{font-size:12px;display:block}
.ai-po{font-size:10px;color:var(--up);background:rgba(14,203,129,.1);padding:1px 5px;border-radius:4px}
.cwrap{position:relative;min-width:0;min-height:0;user-select:none}
.cwrap canvas{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:crosshair}
.tpanel{border-left:1px solid var(--line);overflow:auto;padding:14px;display:flex;flex-direction:column;gap:13px}
.tb-lab{display:block;font-size:11px;color:var(--mut);margin-bottom:6px;font-weight:600}
.amt{display:flex;border:1px solid var(--line2);border-radius:8px;overflow:hidden;background:var(--panel2)}
.amt input{border:0;border-radius:0;text-align:center;font-size:18px;font-weight:700;background:none;padding:10px 4px}
.amt button{width:42px;background:var(--line);border:0;color:var(--mut);cursor:pointer;font:700 15px var(--fm)}
.payrow{display:flex;justify-content:space-between;align-items:center;background:var(--panel2);border-radius:8px;padding:9px 12px;font-size:12px;color:var(--mut)}
.payrow b{font-size:14px;color:var(--up)}
.cp{display:flex;align-items:center;justify-content:center;gap:8px;padding:0;height:64px;border:0;border-radius:10px;color:#fff;cursor:pointer;font-family:var(--fb);transition:filter .15s,opacity .2s}
.cp:disabled{opacity:.4;pointer-events:none}
.cp:hover{filter:brightness(1.1)}
.cp:active{transform:scale(.98)}
.cp.up{background:var(--up)}
.cp.down{background:var(--down)}
.cp .pv{font:700 17px var(--fd)}
.cp .pl{font-size:10px;opacity:.85;display:block}
.call-put{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.conn{font:700 9.5px var(--fb);letter-spacing:.08em;padding:3px 7px;border-radius:4px;border:1px solid var(--line2);color:var(--dim);white-space:nowrap}
.conn.ok{color:var(--up);border-color:rgba(14,203,129,.4)}
.conn.bad{color:var(--down);border-color:rgba(246,70,93,.4)}
/* positions */
.pos-head{display:flex;justify-content:space-between;align-items:center}
.pos-head span{font:600 11px var(--fm);color:var(--dim)}
.pos-r{display:grid;grid-template-columns:auto 1fr auto auto;gap:8px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);font-size:11.5px;position:relative}
.pos-r:last-child{border:0}
.dir{width:22px;height:22px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:10px}
.dir.up{background:rgba(14,203,129,.15);color:var(--up)}
.dir.down{background:rgba(246,70,93,.15);color:var(--down)}
.pos-i b{display:block;font-size:12px}
.pos-i i{font-style:normal;color:var(--dim);font-size:10px}
.pos-s{font:600 10.5px var(--fb)}
.pos-s.w{color:var(--up)}.pos-s.l{color:var(--down)}
.pos-t{font-size:10.5px;color:var(--mut)}
.pos-bar{position:absolute;left:32px;bottom:2px;height:2px;width:calc(100% - 104px);background:var(--line)}
.pos-bar i{display:block;height:100%;background:var(--up)}
.pos-acc{font:600 8.5px var(--fb);color:var(--dim);border:1px solid var(--line2);padding:1px 4px;border-radius:4px;font-style:normal}
.day-stats{display:flex;gap:12px;border-top:1px solid var(--line);padding-top:10px;font-size:11px;color:var(--dim);flex-wrap:wrap}
.day-stats b{font-size:11.5px;color:var(--text)}
.empty{padding:36px 16px;text-align:center;color:var(--dim)}
.empty p{margin:0 0 3px;font-weight:600;color:var(--mut);font-size:13px}
.empty span{font-size:12px}
/* mobile terminal */
.mbar{display:none;position:fixed;left:0;right:0;bottom:calc(52px + env(safe-area-inset-bottom));background:var(--panel);border-top:1px solid var(--line);padding:10px 12px;z-index:87;box-shadow:0 -8px 24px rgba(0,0,0,.4)}
.mbar-in{display:grid;grid-template-columns:130px 1fr 1fr;gap:8px;align-items:center}
.mbar .amt{height:44px}
.mbar .amt input{font-size:15px;padding:6px 2px}
.mbar .cp{height:44px;padding:0 6px}
.mbar .cp .pv{font-size:14px}
.mbar .cp .pl{display:none}
.mchart-h{height:46vh;min-height:250px}
@media(max-width:980px){
  .tnav{display:none}
  .shell{display:flex;flex-direction:column;height:auto;min-height:calc(100dvh - 52px)}
  .aside{border-right:0;border-bottom:1px solid var(--line)}
  .alist{display:flex;overflow-x:auto;padding:8px;gap:8px}
  .atabs,.aside-search{display:none}
  .ai{flex:none;min-width:120px;display:flex;flex-direction:column;gap:2px;border-left:0;border:1px solid var(--line);border-radius:10px;padding:8px 10px}
  .ai.on{border-color:var(--up)}
  .ai-pr{text-align:left}
  .cwrap{height:42vh;min-height:240px;flex:none}
  .tpanel{border-left:0;padding:12px 12px 150px}
  .tpanel .call-put,.tpanel .m-amt-block{display:none}
  .mbar{display:block}
  body{padding-bottom:52px}
}
/* pages */
.pg{max-width:1000px;margin:0 auto;padding:18px 16px 100px;width:100%}
.pg.narrow{max-width:620px}
.pg-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.pg-head h1{font-size:19px;display:flex;align-items:center;gap:8px}
.pn{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
.tbl{width:100%;border-collapse:collapse;font-size:12px}
.tbl th{font:600 10px var(--fb);letter-spacing:.08em;text-transform:uppercase;color:var(--dim);text-align:left;padding:8px 9px;border-bottom:1px solid var(--line)}
.tbl td{padding:9px;border-bottom:1px solid var(--line)}
.tbl tr:last-child td{border:0}
.badge{font:700 9px var(--fb);padding:3px 7px;border-radius:5px;white-space:nowrap}
.badge.win{background:rgba(14,203,129,.14);color:var(--up)}
.badge.loss{background:rgba(246,70,93,.14);color:var(--down)}
.badge.open{background:rgba(240,185,11,.14);color:var(--gold)}
.badge.pend{background:rgba(255,255,255,.07);color:var(--mut)}
.badge.done{background:rgba(14,203,129,.14);color:var(--up)}
.spin{margin-left:auto;width:12px;height:12px;border:2px solid var(--line2);border-top-color:var(--up);border-radius:50%;animation:rot .7s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
.dep-grid{display:grid;grid-template-columns:1fr;gap:14px}
.mrow{display:flex;align-items:center;gap:12px;width:100%;padding:12px 13px;background:var(--panel2);border:1px solid var(--line2);border-radius:10px;cursor:pointer;margin-bottom:8px;color:var(--text);text-align:left}
.mrow.on{border-color:var(--up)}
.mg{width:36px;height:36px;border-radius:9px;background:var(--line);display:flex;align-items:center;justify-content:center;font:700 16px var(--fm);color:var(--gold);flex:none}
.mrow b{display:block;font-size:13px}.mrow i{font-style:normal;font-size:11px;color:var(--mut)}
.mrow .mnote{margin-left:auto;font:500 10.5px var(--fm);color:var(--dim)}
.mrow.on .mnote{color:var(--up)}
.sum-r{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px dashed var(--line);font-size:12.5px}
.sum-r span{color:var(--mut)}.sum-r b{font-family:var(--fm)}
.sum-r.tot{border:0;font-size:14px}.sum-r.tot b{color:var(--up);font-size:16px}
.qrbox{background:#fff;border-radius:10px;padding:10px;width:fit-content;margin:6px auto 12px}
.addr{display:flex;gap:8px;background:var(--bg);border:1px dashed var(--line2);border-radius:8px;padding:9px 11px;margin-bottom:10px}
.addr code{font:500 11px var(--fm);word-break:break-all;flex:1}
.addr button{background:none;border:0;color:var(--up);cursor:pointer;display:flex;padding:2px}
.stg{display:flex;align-items:center;gap:10px;padding:10px 2px;color:var(--dim);font-size:12.5px;border-bottom:1px dashed var(--line)}
.stg:last-child{border:0}
.stg.done{color:var(--text)}.stg.done .ic{color:var(--up)}
.stg.run{color:var(--up)}.stg.run .ic{color:var(--up)}
.big-check{width:60px;height:60px;border-radius:50%;background:var(--up);color:#fff;display:flex;align-items:center;justify-content:center;margin:0 auto 16px}
.card-f{display:grid;grid-template-columns:1fr 1fr;gap:10px}.card-f .full{grid-column:1/-1}
.hint{font-size:11.5px;color:var(--dim);line-height:1.55;margin:8px 0 0}
.hint b{color:var(--up);font-family:var(--fm)}
.stat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.stat{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:12px}
.stat span{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);font-weight:600}
.stat b{display:block;font:600 18px var(--fm);margin-top:4px}
/* digits */
.dg-strip{display:flex;gap:5px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none}
.dg-strip::-webkit-scrollbar{display:none}
.dg-d{width:34px;height:34px;flex:none;border-radius:8px;display:flex;align-items:center;justify-content:center;font:700 14px var(--fm);background:var(--panel2);border:1px solid var(--line)}
.dg-d.e{color:var(--up)}.dg-d.o{color:var(--down)}
.dg-pick{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin:8px 0 12px}
.dg-pick button{padding:12px 0;font:700 15px var(--fm);background:var(--panel2);border:1px solid var(--line2);border-radius:8px;color:var(--mut);cursor:pointer}
.dg-pick button.on{border-color:var(--up);color:var(--up);background:rgba(14,203,129,.08)}
/* acca */
.leg{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 10px;background:var(--panel2);border:1px solid var(--line2);border-radius:9px;margin-bottom:7px}
.leg b{font-size:12.5px}.leg i{font-style:normal;font-size:10px;color:var(--dim);display:block}
.dirpick{display:flex;gap:5px}
.dirpick button{padding:7px 11px;border-radius:7px;border:1px solid var(--line2);background:none;color:var(--mut);font:700 11px var(--fb);cursor:pointer}
.dirpick button.on.up{background:var(--up);color:#fff;border-color:var(--up)}
.dirpick button.on.down{background:var(--down);color:#fff;border-color:var(--down)}
/* scanner */
.scan-it{background:var(--panel2);border:1px solid var(--line2);border-radius:10px;padding:12px;margin-bottom:9px}
.scan-top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.scan-top b{font-size:13px}
.scan-sig{font:700 10.5px var(--fb);padding:4px 9px;border-radius:6px}
.scan-sig.up{background:rgba(14,203,129,.15);color:var(--up)}
.scan-sig.down{background:rgba(246,70,93,.15);color:var(--down)}
.scan-sig.dg{background:rgba(240,185,11,.15);color:var(--gold)}
.scan-sig.n{background:rgba(255,255,255,.06);color:var(--mut)}
.scan-bar{height:4px;background:var(--line);border-radius:3px;margin:9px 0 6px;overflow:hidden}
.scan-bar i{display:block;height:100%;background:var(--up)}
.scan-why{font-size:11.5px;color:var(--mut);line-height:1.5}
/* support */
.chat{display:flex;flex-direction:column;gap:9px;min-height:40vh;padding:4px 0}
.msg{max-width:82%;padding:9px 12px;border-radius:12px;font-size:13.5px;line-height:1.55;white-space:pre-wrap}
.msg.me{align-self:flex-end;background:var(--up);color:#fff;border-bottom-right-radius:3px}
.msg.bot{align-self:flex-start;background:var(--panel2);border:1px solid var(--line);border-bottom-left-radius:3px}
.chat-in{display:flex;gap:8px;margin-top:6px}.chat-in input{flex:1}
/* auth modal */
.mwrap{position:fixed;inset:0;background:rgba(4,6,8,.7);backdrop-filter:blur(3px);z-index:500;display:flex;align-items:center;justify-content:center;padding:16px;animation:fin .15s}
@keyframes fin{from{opacity:0}}
.mbox{background:var(--panel);border:1px solid var(--line2);border-radius:14px;padding:22px;width:min(400px,100%);max-height:92dvh;overflow:auto;position:relative}
.mbox h2{font-size:20px;margin-bottom:4px}
.mbox .sub{color:var(--mut);font-size:13px;margin:0 0 18px}
.mtabs{display:flex;gap:6px;margin-bottom:18px}
.mtabs button{flex:1;padding:10px;border-radius:8px;border:1px solid var(--line2);background:none;color:var(--mut);font:600 13px var(--fb);cursor:pointer}

const fmtDT=t=>{const d=new Date(t);return d.toLocaleDateString('en-US',{month:'short',day:'numeric'})+' '+d.toTimeString().slice(0,5)};
const count=ms=>{const s=Math.max(0,Math.ceil(ms/1000));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
function gauss(){let u=0,v=0;while(!u)u=Math.random();while(!v)v=Math.random();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v)}
function niceStep(x){const p=Math.pow(10,Math.floor(Math.log10(x)));const n=x/p;return (n<1.5?1:n<3?2:n<7?5:10)*p}
function luhn(s){let sum=0,alt=false;for(let i=s.length-1;i>=0;i--){let n=+s[i];if(alt){n*=2;if(n>9)n-=9}sum+=n;alt=!alt}return sum%10===0}

function confirmDialog({title,body,ok='Confirm',danger=false}){

/* ── market feed ── */
const FEED=[
  {id:'EURUSD',name:'EUR/USD',cat:'Forex',start:1.08423,vol:0.00006,dec:5,payout:85},
  {id:'GBPUSD',name:'GBP/USD',cat:'Forex',start:1.27164,vol:0.00009,dec:5,payout:83},
  {id:'USDJPY',name:'USD/JPY',cat:'Forex',start:154.281,vol:0.011,dec:3,payout:82},
  {id:'BTCUSD',name:'BTC/USD',cat:'Crypto',start:67432,vol:16,dec:0,payout:88},
  {id:'ETHUSD',name:'ETH/USD',cat:'Crypto',start:3418.4,vol:1.2,dec:1,payout:86},
  {id:'XAUUSD',name:'GOLD',cat:'Commodity',start:2382.6,vol:0.5,dec:2,payout:84},
];
const lastDigit=a=>{const s=(+a.price).toFixed(a.dec);return +s[s.length-1]};
const digitMult=(option,t)=>{
  const prob=option==='even'||option==='odd'?.5
    :option==='over'?(9-t)/10:option==='under'?t/10
    :option==='match'?.1:.9;
  return Math.max(1.01,Math.floor((0.95/prob)*100)/100)};
const Market={
  A:FEED.map(a=>({...a,price:a.start,drift:0,dir:1,ticks:[]})),
  _cc:{},subs:new Set(),_pb:false,_synced:false,connected:USE_DEMO,lastOk:0,
  init(){
    if(USE_DEMO){
      const now=Date.now();
      this.A.forEach(a=>{let p=a.start;const t0=now-65*60*1000;
        for(let t=t0;t<now;t+=1000){p=this.step(a,p);a.ticks.push({t,p});}
        a.price=p;});
    }
    setInterval(()=>this.tick(),USE_DEMO?400:1000);
  },
  step(a,p){
    if(Math.random()<0.03)a.drift=(Math.random()-0.5)*a.vol*0.9;
    const pull=(a.start-p)/a.start*a.vol*0.35;
    return Math.max(a.start*0.3,p+a.drift+a.vol*gauss()+pull);
  },
  tick(){
    if(!USE_DEMO){this.pullRemote();
      if(this.connected&&Date.now()-this.lastOk>8000){this.connected=false;this.subs.forEach(f=>f());}
      return}
    const t=Date.now();
    this.A.forEach(a=>{const p=this.step(a,a.price);
      a.dir=p>a.price?1:p<a.price?-1:a.dir;a.price=p;
      a.ticks.push({t,p});if(a.ticks.length>4200)a.ticks.splice(0,a.ticks.length-4200);});
    this.subs.forEach(f=>f());
  },
  async pullRemote(){
    if(this._pb)return;this._pb=true;
    try{
      const r=await API.prices(),t=r.t||Date.now();
      for(const id in r.p){
        const a=this.byId(id);if(!a)continue;
        const p=+r.p[id];if(!p)continue;
        if(!this._synced){
          let q=p;const hist=[],t0=t-65*60*1000;
          for(let tt=t0;tt<t;tt+=1000){q=this.step(a,q);hist.push({t:tt,p:q});}
          hist.push({t,p});
          a.ticks=hist;a.price=p;a.dir=1;
        }else{
          a.dir=p>a.price?1:p<a.price?-1:a.dir;a.price=p;
          a.ticks.push({t,p});if(a.ticks.length>4200)a.ticks.splice(0,a.ticks.length-4200);
        }
      }
      this._synced=true;
      if(!this.connected){this.connected=true;}
      this.lastOk=Date.now();
      this.subs.forEach(f=>f());
    }catch{}
    this._pb=false;
  },
  on(f){this.subs.add(f);return()=>this.subs.delete(f)},
  byId(id){return this.A.find(a=>a.id===id)},
  _build(a,tf){
    const out=[];let cur=null;
    for(const k of a.ticks){const b=Math.floor(k.t/(tf*1000))*(tf*1000);
      if(!cur||cur.t!==b){if(cur)out.push(cur);cur={t:b,o:k.p,h:k.p,l:k.p,c:k.p};}
      else{if(k.p>cur.h)cur.h=k.p;if(k.p<cur.l)cur.l=k.p;cur.c=k.p;}}
    if(cur)out.push(cur);return out;
  },
  candles(a,tf,cnt){
    const key=a.id+'|'+tf,now=Date.now();let e=this._cc[key];
    if(!e||now-e.at>200){e=this._cc[key]={at:now,arr:this._build(a,tf)};}
    return cnt?e.arr.slice(-cnt):e.arr;
  },
  fmtP(a,p=a.price){return (+p).toLocaleString('en-US',{minimumFractionDigits:a.dec,maximumFractionDigits:a.dec})},
};

/* ── chart ── */
const CC={bg:'#0B0E11',grid:'rgba(234,236,239,.08)',gridS:'rgba(234,236,239,.04)',
  text:'#EAECEF',mut:'#848E9C',dim:'#5E6673',up:'#0ECB81',down:'#F6465D',acc:'#F0B90B'};
function rr(c,x,y,w,h,rad){c.beginPath();c.moveTo(x+rad,y);c.arcTo(x+w,y,x+w,y+h,rad);c.arcTo(x+w,y+h,x,y+h,rad);c.arcTo(x,y+h,x,y,rad);c.arcTo(x,y,x+w,y,rad);c.closePath()}
class Chart{
  constructor(cv,o){
    this.cv=cv;this.ctx=cv.getContext('2d');this.o=Object.assign({compact:false,trades:null,pulses:null},o);
    this.slot=9;this.offset=0;this.ease=null;this.drag=null;this.mouse=null;this.dead=false;
    this.ro=new ResizeObserver(()=>this.rs());this.ro.observe(cv.parentElement);this.rs();
    cv.addEventListener('mousemove',e=>{const r=cv.getBoundingClientRect();
      this.mouse={x:e.clientX-r.left,y:e.clientY-r.top};
      if(this.drag)this.offset=clamp(this.drag.off+(e.clientX-this.drag.x)/this.slot,0,this.maxOff());});
    cv.addEventListener('mouseleave',()=>{this.mouse=null;this.drag=null});
    cv.addEventListener('mousedown',e=>{this.drag={x:e.clientX,off:this.offset};cv.style.cursor='grabbing'});
    window.addEventListener('mouseup',()=>{this.drag=null;cv.style.cursor=''});
    cv.addEventListener('wheel',e=>{e.preventDefault();
      this.slot=clamp(this.slot*(e.deltaY<0?1.16:1/1.16),3.2,26);
      this.offset=clamp(this.offset,0,this.maxOff());},{passive:false});
    cv.addEventListener('touchstart',e=>{if(e.touches.length===1)this.drag={x:e.touches[0].clientX,off:this.offset}},{passive:true});
    cv.addEventListener('touchmove',e=>{if(e.touches.length===1&&this.drag)
      this.offset=clamp(this.drag.off+(e.touches[0].clientX-this.drag.x)/this.slot,0,this.maxOff());},{passive:true});
    cv.addEventListener('touchend',()=>this.drag=null,{passive:true});
    this.loop=this.loop.bind(this);requestAnimationFrame(this.loop);
  }
  rs(){const p=this.cv.parentElement,d=devicePixelRatio||1;
    this.W=p.clientWidth;this.H=p.clientHeight;
    this.cv.width=Math.max(1,this.W*d);this.cv.height=Math.max(1,this.H*d);
    this.ctx.setTransform(d,0,0,d,0,0);}
  destroy(){this.dead=true;this.ro.disconnect()}
  setAsset(){this.ease=null}
  cds(){return Market.candles(Market.byId(dg(this.o.asset)),dg(this.o.tf),430)}
  maxOff(){return Math.max(0,this.cds().length-8)}
  loop(){if(this.dead)return;requestAnimationFrame(this.loop);if(this.W>40)this.draw()}
  _pill(x,y,w,h,txt,bg,fg){const c=this.ctx;rr(c,x,y,w,h,4);c.fillStyle=bg;c.fill();
    c.fillStyle=fg;c.font='600 10px "JetBrains Mono",monospace';c.textAlign='center';c.textBaseline='middle';c.fillText(txt,x+w/2,y+h/2+.5)}
  draw(){
    const c=this.ctx,W=this.W,H=this.H,comp=this.o.compact;
    const a=Market.byId(dg(this.o.asset)),tf=dg(this.o.tf);
    const cds=this.cds();if(!a||cds.length<2){c.clearRect(0,0,W,H);return}
    const padR=comp?58:64,padB=comp?6:20,padT=comp?10:12,padL=0;
    const pw=W-padL-padR,ph=H-padT-padB;
    const fut=8;
    const off=this.offset=clamp(this.offset,0,Math.max(0,cds.length-6));
    const vis=clamp(Math.floor(pw/this.slot),6,cds.length);
    const view=cds.slice(Math.max(0,cds.length-vis-off));
    if(view.length<2)return;
    let hi=-1e18,lo=1e18;for(const k of view){if(k.h>hi)hi=k.h;if(k.l<lo)lo=k.l}
    const rg=(hi-lo)||a.price*0.001;hi+=rg*.07;lo-=rg*.07;
    const Y=p=>padT+(hi-p)/(hi-lo)*ph;
    const rightX=padL+pw;
    const X=i=>rightX-fut*this.slot-(view.length-1-i)*this.slot-this.slot*.5;
    const anchor=view[view.length-1].t;
    const xT=t=>rightX-fut*this.slot-((anchor-t)/(tf*1000)+.5)*this.slot;
    c.clearRect(0,0,W,H);c.textBaseline='middle';c.lineWidth=1;
    const stp=niceStep((hi-lo)/(comp?3.2:5));
    c.font='10px "JetBrains Mono",monospace';
    for(let p=Math.ceil(lo/stp)*stp;p<hi;p+=stp){const y=Y(p);
      c.strokeStyle=CC.gridS;c.beginPath();c.moveTo(padL,y);c.lineTo(rightX,y);c.stroke();
      if(!comp){c.fillStyle=CC.dim;c.textAlign='left';c.fillText(Market.fmtP(a,p),rightX+7,y);}}
    if(!comp){const k=Math.max(1,Math.ceil(76/this.slot));c.textAlign='center';
      for(let i=view.length-1;i>=0;i--){const k2=view[i];
        if(k2.t%(k*tf*1000)!==0)continue;const x=X(i);
        c.strokeStyle=CC.gridS;c.beginPath();c.moveTo(x,padT);c.lineTo(x,padT+ph);c.stroke();
        c.fillStyle=CC.dim;const d=new Date(k2.t);
        c.fillText(tf<60?d.toTimeString().slice(3,8):d.toTimeString().slice(0,5),x,H-9);}
      const gx=rightX-fut*this.slot;c.strokeStyle=CC.grid;c.setLineDash([3,4]);
      c.beginPath();c.moveTo(gx,padT);c.lineTo(gx,padT+ph);c.stroke();c.setLineDash([]);}
    const bw=Math.max(1,this.slot*.62);
    for(let i=0;i<view.length;i++){const k=view[i],x=X(i),up=k.c>=k.o,col=up?CC.up:CC.down;
      c.strokeStyle=col;c.beginPath();c.moveTo(x,Y(k.h));c.lineTo(x,Y(k.l));c.stroke();
      c.fillStyle=col;const y1=Y(Math.max(k.o,k.c)),y2=Y(Math.min(k.o,k.c));
      c.fillRect(x-bw/2,y1,bw,Math.max(1,y2-y1));}
    for(const t of (dg(this.o.trades)||[])){
      const col=t.dir==='up'?CC.up:CC.down,ey=Y(t.entry);
      if(ey>padT&&ey<padT+ph){
        c.strokeStyle=col;c.setLineDash([5,4]);c.beginPath();c.moveTo(padL,ey);c.lineTo(rightX,ey);c.stroke();c.setLineDash([]);
        const lab=(t.dir==='up'?'▲ ':'▼ ')+money(t.amount);
        c.font='600 10px "JetBrains Mono",monospace';const w=c.measureText(lab).width+12;
        c.fillStyle=col;rr(c,padL+6,ey-9,w,18,4);c.fill();
        c.fillStyle=CC.bg;c.textAlign='left';c.fillText(lab,padL+12,ey);}
      const ex=xT(t.expiry);
      if(ex>padL&&ex<rightX){
        c.strokeStyle=col;c.setLineDash([4,4]);c.beginPath();c.moveTo(ex,padT);c.lineTo(ex,padT+ph);c.stroke();c.setLineDash([]);
        const lab=count(t.expiry-Date.now());
        c.font='600 10px "JetBrains Mono",monospace';const w=c.measureText(lab).width+10;
        c.fillStyle=CC.bg;rr(c,ex-w/2,padT+2,w,16,4);c.fill();c.stroke();
        c.fillStyle=col;c.textAlign='center';c.fillText(lab,ex,padT+10);}}
    if(off===0){
      const lp=a.price;this.ease=this.ease==null?lp:this.ease+(lp-this.ease)*.18;
      const y=Y(clamp(this.ease,lo,hi)),col=a.dir>=0?CC.up:CC.down;
      c.strokeStyle=col;c.setLineDash([4,4]);c.beginPath();c.moveTo(padL,y);c.lineTo(rightX,y);c.stroke();c.setLineDash([]);
      const txt=Market.fmtP(a);c.font='600 10.5px "JetBrains Mono",monospace';
      const w=c.measureText(txt).width+12;
      c.fillStyle=col;rr(c,rightX+2,y-9,w,18,4);c.fill();
      c.fillStyle=CC.bg;c.textAlign='left';c.fillText(txt,rightX+8,y);}
    for(const p of (dg(this.o.pulses)||[])){
      const age=(performance.now()-p.at)/950;if(age>=1)continue;
      const x=xT(p.time),y=Y(p.price);
      c.globalAlpha=(1-age)*.9;c.strokeStyle=p.win?CC.up:CC.down;c.lineWidth=2;
      c.beginPath();c.arc(x,y,4+age*30,0,7);c.stroke();c.lineWidth=1;c.globalAlpha=1;}
  }
}

/* ── store + API ── */
const Live={all:[]};
const API={
  BASE:API_URL,
  token(){return localStorage.getItem('vanta_token')},
  setToken(t){t?localStorage.setItem('vanta_token',t):localStorage.removeItem('vanta_token')},
  async request(path,{method='GET',body,auth=true}={}){
    const h={'Content-Type':'application/json'};
    if(auth&&this.token())h.Authorization='Bearer '+this.token();
    const r=await fetch(this.BASE+path,{method,headers:h,body:body?JSON.stringify(body):undefined});
    let d={};try{d=await r.json()}catch{}
    if(!r.ok)throw new Error(d.message||('Request failed ('+r.status+')'));
    return d;
  },
  prices(){return this.request('/prices',{auth:false})},
  register(p){return this.request('/auth/register',{method:'POST',body:p,auth:false})},
  login(p){return this.request('/auth/login',{method:'POST',body:p,auth:false})},
  me(){return this.request('/me')},
  placeTrade(p){return this.request('/trades',{method:'POST',body:p})},
  syncTrades(){return this.request('/trades/sync')},
  listTrades(){return this.request('/trades')},
  listTx(){return this.request('/transactions')},
  createDeposit(p){return this.request('/deposits',{method:'POST',body:p})},
  getDeposit(id){return this.request('/deposits/'+id)},
  completeDeposit(id){return this.request('/deposits/'+id+'/confirm',{method:'POST'})},
  createWithdrawal(p){return this.request('/withdrawals',{method:'POST',body:p})},
};

const Auth={
  u:null,
  get acc(){return localStorage.getItem('vanta_acc')||'demo'},
  set acc(v){localStorage.setItem('vanta_acc',v)},
  bal(a=this.acc){return this.u?this.u.wallets[a]:10000},
  bump(acc,v){if(this.u){this.u.wallets[acc]=Math.round((this.u.wallets[acc]+v)*100)/100;Bus.emit('wallet')}},
  async boot(){
    const t=API.token();
    if(t){try{const r=await API.me();this.u=r.user||r}catch(e){if(/log in/i.test(e.message))API.setToken(null)}}
    Market.init();this.startSync();
  },
  set(u,token){this.u=u;API.setToken(token);Live.all=[];Bus.emit('wallet')},
  logout(){API.setToken(null);this.u=null;Live.all=[];toast('info','Logged out');render()},
  settleToast(t){
    const a=Market.byId(t.asset);
    const what=t.kind==='digits'?t.option.toUpperCase()+(t.target!=null?' '+t.target:'')
      :t.kind==='acc'?'ACCA ×'+t.legs.length:t.dir.toUpperCase();
    const det=t.kind==='digits'?'digit '+t.entry+' → '+t.close
      :t.kind==='acc'?'all legs must land':Market.fmtP(a,t.entry)+' → '+Market.fmtP(a,t.close);
    if(t.result==='win')toast('win',`Won ${money(t.profit)} · ${what}`,`${a.name} · ${det}`);
    else if(t.result==='draw')toast('info','Flat close — stake refunded',`${a.name} · ${what}`);
    else toast('loss',`Lost ${money(t.amount)} · ${what}`,`${a.name} · ${det}`);
  },
  startSync(){
    if(this._sync)return;
    let n=0;
    this._sync=setInterval(async()=>{
      if(!this.u)return;
      if(++n%7===0){try{const m=await API.me();this.u=m.user||m;Bus.emit('wallet')}catch{}}
      try{
        const r=await API.syncTrades();
        const openIds=new Set((r.open||[]).map(t=>t.id));
        Live.all=Live.all.filter(t=>t.status==='closed'||openIds.has(t.id));
        (r.open||[]).forEach(t=>{const i=Live.all.findIndex(x=>x.id===t.id);
          if(i>=0)Live.all[i]=t;else Live.all.unshift(t);});
        (r.closed||[]).forEach(t=>{
          const i=Live.all.findIndex(x=>x.id===t.id);
          if(i>=0)Live.all[i]=t;else Live.all.unshift(t);
          this.settleToast(t);});
        if((r.closed||[]).length)Bus.emit('trades');
      }catch{}
    },700);
  },
};

function wireShell(){
  const wpB=$('#wp-btn'),wpD=$('#wp-drop'),umB=$('#um-btn'),umD=$('#um-drop');
  const close=e=>{if(wpD&&!e.target.closest('.wpill'))wpD.hidden=true;
    if(umD&&!e.target.closest('#um-btn,#um-drop'))umD.hidden=true};
  setTimeout(()=>document.addEventListener('click',close),0);
  onCleanup(()=>document.removeEventListener('click',close));
  if(wpB)wpB.onclick=()=>{if(wpD)wpD.hidden=!wpD.hidden;if(umD)umD.hidden=true};
  if(umB)umB.onclick=()=>{umD.hidden=!umD.hidden;if(wpD)wpD.hidden=true};
  $$('.drop-it[data-acc]').forEach(b=>b.onclick=()=>{Auth.acc=b.dataset.acc;Bus.emit('wallet');render()});
  const db=$('#dep-btn');if(db)db.onclick=()=>location.hash='#/deposit';
  const lb=$('#login-btn');if(lb)lb.onclick=()=>openAuth('login');
  const out=$('#um-out');if(out)out.onclick=()=>Auth.logout();
  onCleanup(Bus.on('wallet',()=>{
    const el=$('.wp-bal');if(el){el.textContent=money(Auth.bal());
      el.classList.remove('bump');void el.offsetWidth;el.classList.add('bump');}
    $$('.drop-it[data-acc] b').forEach(b=>{const k=b.closest('[data-acc]').dataset.acc;
      if(Auth.u)b.textContent=money(Auth.u.wallets[k])});
  }));
}
function tradeLabel(t){

  if(t.kind==='acc')return 'ACCA ×'+(t.legs?t.legs.length:'?');

}

/* ── SCANNER ── */
function Scanner(app){
  let rows=[];
  function analyze(){
    const out=[];
    for(const a of Market.A){
      const t=a.ticks;if(t.length<60)continue;
      const cut=t[t.length-61];
      const mom=(a.price-cut.p)/a.vol;
      let ups=0;for(let i=t.length-30;i<t.length;i++)if(t[i].p>t[i-1].p)ups++;
      const upRatio=ups/30;
      const digs=a.ticks.slice(-20).map(k=>lastDigit(a));
      const even=digs.filter(d=>d%2===0).length/20;
      let sig='n',why='Balanced tape — no strong edge right now.';
      if(mom>=1.4){sig='up';why=`Strong upward momentum: ${mom.toFixed(1)}σ over 60s, ${Math.round(upRatio*100)}% of last 30 ticks rising.`;}
      else if(mom<=-1.4){sig='down';why=`Strong downward momentum: ${mom.toFixed(1)}σ over 60s, only ${Math.round(upRatio*100)}% of last 30 ticks rising.`;}
      else if(even>=.7){sig='dg';why=`Digit bias: ${Math.round(even*100)}% of last 20 digits were EVEN — parity one-sided.`;}
      else if(even<=.3){sig='dg';why=`Digit bias: ${Math.round((1-even)*100)}% of last 20 digits were ODD — parity one-sided.`;}
      const score=Math.round(clamp(Math.abs(mom)*22+Math.abs(even-.5)*80,4,97));
      out.push({a,sig,why,score,
        play:sig==='up'?'UP':sig==='down'?'DOWN':sig==='dg'?(even>=.7?'EVEN':'ODD'):'—'});
    }
    out.sort((x,y)=>y.score-x.score);
    rows=out;
  }
  function drawList(){
    $('#sc-list').innerHTML=rows.map(r=>`
      <div class="scan-it">
        <div class="scan-top">
          <b>${r.a.name} <i class="pos-acc">${r.a.cat}</i></b>
          <span class="scan-sig ${r.sig}">${r.play==='—'?'NO EDGE':r.play+' · '+r.score+'%'}</span>
        </div>
        <div class="scan-bar"><i style="width:${r.score}%"></i></div>
        <div class="scan-why">${r.why}</div>
      </div>`).join('');
  }
  app.innerHTML=shell('/scanner',`<div class="pg narrow">
    <div class="pg-head"><h1>${icon('radar',19)} AI Scanner</h1>
      <span class="conn ok" id="sc-live">● SCANNING</span></div>
    <div class="pn">
      <p class="hint" style="margin:0 0 12px">${icon('info',13)} Live statistical sweep of every market — momentum (σ over 60s), tick direction ratio, last-digit parity bias — ranked strongest first. <b>Probabilities, not guarantees.</b></p>
      <div id="sc-list"></div>
    </div></div>`;
  wireHeader;
  wireShell();
  analyze();drawList();
  const iv=setInterval(()=>{analyze();if($('#sc-list'))drawList()},4000);
  onCleanup(()=>clearInterval(iv));
}

      </div>${sumPanel()}`;
    if(step===2&&method==='mpesa')return `<div class="pn">
        <h3 style="font-size:15px;margin-bottom:4px">M-Pesa · ${money(dep.total)}</h3>
        <p class="hint" style="margin:0 0 12px">Request for <b>${esc(dep.instructions.phone)}</b>${dep.instructions.kesAmount?` · <b>KES ${dep.instructions.kesAmount.toLocaleString()}</b>`:''}.</p>
        <div id="stages"></div>
        <p class="hint" style="margin-top:12px">${icon('info',13)} Real STK Push needs Daraja wired. For testing, approve below.</p>
        <button class="btn btn-up wide" id="mp-sim" style="margin-top:12px">${icon('check',14)} Dev approve (test)</button>
        <button class="btn btn-ghost wide" id="mp-cancel" style="margin-top:8px">Cancel</button>
      </div>${sumPanel()}`;
    if(step===2&&method!=='card')return `<div class="pn">
        <h3 style="font-size:15px;margin-bottom:4px">Send ${money(dep.total)} in ${method.toUpperCase()}</h3>
        <p class="hint" style="margin:0 0 12px">Network: <b>${esc(dep.instructions.network)}</b> — wrong network can lose funds.</p>
        <div class="qrbox"><canvas id="qr" width="164" height="164"></canvas></div>
        <label class="tb-lab">Deposit address</label>
        <div class="addr"><code>${esc(dep.instructions.address)}</code>
          <button id="cp-addr">${icon('copy',14)}</button></div>
        <p class="hint" style="margin-bottom:12px">Address is a <b>placeholder</b> until a crypto provider is wired. Test mode: confirm below.</p>
        <button class="btn btn-up wide" id="sent">${icon('check',14)} I've sent the funds</button>
      </div>${sumPanel()}`;
    if(step===2)return `<div class="pn"><h3 style="font-size:15px;margin-bottom:12px">Card · ${money(dep.total)}</h3>
        <div class="card-f">
          <div class="full"><label class="tb-lab">Card number</label><input id="c-num" inputmode="numeric" placeholder="4242 4242 4242 4242"></div>
          <div><label class="tb-lab">Expiry</label><input id="c-exp" inputmode="numeric" placeholder="MM/YY"></div>
          <div><label class="tb-lab">CVV</label><input id="c-cvv" inputmode="numeric" placeholder="123" type="password"></div>
          <div class="full"><label class="tb-lab">Name on card</label><input id="c-name" placeholder="ALEX TRADER"></div>
        </div>
        <p class="hint" style="margin-bottom:12px">Test checkout — <b>4242 4242 4242 4242</b>, any future expiry, any CVV.</p>
        <button class="btn btn-up wide" id="c-pay">${icon('lock',14)} Pay ${money(dep.total)}</button>
      </div>${sumPanel()}`;
    if(phase==='done')return `<div class="pn" style="text-align:center;padding:36px 16px">
        <div class="big-check">${icon('check',28)}</div>
        <h3 style="font-size:17px;margin-bottom:4px">${money(dep.total)} credited</h3>
        <p class="hint" style="margin:0 0 18px">${dep.bonus?`Includes ${money(dep.bonus)} bonus (${esc(dep.bonusCode)}). `:''}REAL wallet ready.</p>
        <a class="btn btn-up big" href="#/">Trade now</a>
      </div>`;
    return `<div class="pn"><h3 style="font-size:15px;margin-bottom:10px">Processing…</h3>
        <div id="stages"></div></div>${sumPanel()}`;
  }
  function draw(){
    app.innerHTML=shell('/deposit',`<div class="pg"><div class="pg-head"><h1>Deposit</h1>
      <div class="chips"><span style="padding:7px 12px;font:600 11px var(--fm);color:var(--dim)">STEP ${step} / 3</span></div></div>
      <div class="dep-grid">${depBody()}</div></div>`);
    wireShell();wire();
  }
  const STAGES_CRYPTO=['Awaiting payment','Seen on network','1 / 3 confirmations','2 / 3 confirmations','Credited to REAL wallet'];
  const STAGES_CARD=['Contacting gateway','3-D Secure check','Approving payment','Crediting REAL wallet'];
  function setStages(names,idx){
    $('#stages').innerHTML=names.map((n,i)=>`<div class="stg ${i<idx?'done':i===idx?'run':''}">
      ${icon(i<idx?'check':'clock',14)}<span>${n}</span>${i===idx?'<i class="spin"></i>':''}</div>`).join('');
  }
  async function runStages(names,gap){for(let i=0;i<names.length;i++){setStages(names,i);await sleep(gap)}}
  const creditAndDone=d=>{dep=d;Auth.bump('real',d.total);
    toast('ok',`Deposited ${money(d.total)}`,'Credited to your REAL wallet.');
    phase='done';draw();};
  function wire(){
    if(step===1){
      $$('.mrow',app).forEach(b=>b.onclick=()=>{method=b.dataset.m;draw()});
      $$('.qchips button[data-q]',app).forEach(b=>b.onclick=()=>{$('#dep-amt').value=b.dataset.q});
      $('#dep-go').onclick=async()=>{
        const s=summary();
        if(!(s.amt>=MIN_DEPOSIT))return toast('warn','Amount too small','Minimum deposit is $'+MIN_DEPOSIT.toFixed(2)+'.');
        if(s.amt>100000)return toast('warn','Amount too large','Maximum is $100,000.00.');
        if(s.note)return toast('warn','Promo not applied',s.note);
        const go=$('#dep-go');go.classList.add('busy');
        let phone=null;
        if(method==='mpesa'){phone=normPhone($('#mp-phone')?.value);
          if(!/^254(7|1)\d{8}$/.test(phone)){go.classList.remove('busy');
            return toast('warn','Check the number','Enter a valid Safaricom number, e.g. 0712 345 678.');}}
        try{dep=await API.createDeposit({method,amount:s.amt,bonusCode:s.code,phone});
          step=2;draw();
        }catch(e){toast('warn','Could not create deposit',e.message);go.classList.remove('busy')}
      };
    }else if(step===2&&method==='mpesa'){
      $('#mp-cancel').onclick=()=>{step=1;dep=null;draw()};
      const stages=['Request sent to Safaricom','Waiting for M-Pesa PIN','Crediting REAL wallet'];
      const setS=i=>{const el=$('#stages');if(!el)return;el.innerHTML=stages.map((n,j)=>
        `<div class="stg ${j<i?'done':j===i?'run':''}">${icon(j<i?'check':'clock',14)}<span>${n}</span>${j===i?'<i class="spin"></i>':''}</div>`).join('')};
      (async()=>{setS(1);
        for(let i=0;i<40;i++){
          await sleep(3000);
          if(!$('#stages'))return;
          let d;try{d=await API.getDeposit(dep.id)}catch{continue}
          if(d.status==='confirmed'){setS(3);await sleep(500);creditAndDone(d);return}
          if(d.status==='failed'&&$('#stages')){$('#stages').innerHTML=
            `<div class="stg" style="color:var(--down)">${icon('warn',14)}<span>Payment cancelled or failed.</span></div>`;return}
        }
        if($('#stages'))$('#stages').innerHTML=
          `<div class="stg" style="color:var(--down)">${icon('warn',14)}<span>Timed out — no payment received.</span></div>`;
      })();
      $('#mp-sim').onclick=async()=>{
        const b=$('#mp-sim');b.classList.add('busy');
        try{const d=await API.completeDeposit(dep.id);creditAndDone(d)}
        catch(e){toast('warn',e.message);b.classList.remove('busy')}
      };
    }else if(step===2&&method!=='card'){
      const cv=$('#qr');
      try{if(cv&&window.QRCode)QRCode.toCanvas(cv,dep.instructions.address,{width:164,margin:1,color:{dark:'#141610',light:'#ffffff'}},()=>{})}catch{}
      $('#cp-addr').onclick=async()=>{try{await navigator.clipboard.writeText(dep.instructions.address);
        toast('ok','Address copied')}catch{}};
      $('#sent').onclick=async()=>{
        step=3;draw();
        await runStages(STAGES_CRYPTO,1300);
        try{const d=await API.completeDeposit(dep.id);creditAndDone(d)}
        catch(e){toast('warn',e.message);step=2;draw()}
      };
    }else if(step===2){
      const num=$('#c-num'),exp2=$('#c-exp'),cvv=$('#c-cvv');
      num.oninput=()=>{num.value=num.value.replace(/\D/g,'').slice(0,16).replace(/(\d{4})(?=\d)/g,'$1 ')};
      exp2.oninput=()=>{let v=exp2.value.replace(/\D/g,'').slice(0,4);exp2.value=v.length>2?v.slice(0,2)+'/'+v.slice(2):v};
      cvv.oninput=()=>{cvv.value=cvv.value.replace(/\D/g,'').slice(0,4)};
      $('#c-pay').onclick=async()=>{
        const d=num.value.replace(/\s/g,'');
        if(!(d.length===16&&luhn(d)))return toast('warn','Check the card number');
        if(!/^(0[1-9]|1[0-2])\/\d{2}$/.test(exp2.value))return toast('warn','Expiry','Use MM/YY');
        if(cvv.value.length<3)return toast('warn','CVV','3–4 digits');
        if($('#c-name').value.trim().length<2)return toast('warn','Cardholder name required');
        const b=$('#c-pay');b.classList.add('busy');
        step=3;draw();
        await runStages(STAGES_CARD,1400);
        try{const d2=await API.completeDeposit(dep.id);creditAndDone(d2)}
        catch(e){toast('warn',e.message);step=2;draw()}
      };
    }
  }
  draw();
}

/* ── WITHDRAW ── */
function Withdraw(app){
  const METHODS=[
    {id:'mpesa',name:'M-Pesa',fee:1,ph:'07XX XXX XXX (Safaricom)'},
    {id:'usdt',name:'USDT · TRC-20',fee:1,ph:'T… TRC-20 address'},
    {id:'btc',name:'BTC',fee:2,ph:'bc1… or 1… Bitcoin address'},
    {id:'eth',name:'ETH · ERC-20',fee:1.5,ph:'0x… Ethereum address'},
    {id:'card',name:'Visa / Mastercard',fee:0,ph:'16-digit card number'},
  ];
  let method='mpesa',wd=null,phase='form';
  const M=()=>METHODS.find(m=>m.id===method);
  const feeOf=m=>m==='card'?0:{mpesa:1,usdt:1,btc:2,eth:1.5}[m];
  const feeOfAmt=a=>method==='card'?+(a*0.015).toFixed(2):feeOf(method);
  function recentHTML(list){
    if(!list.length)return '';
    return `<div class="pn"><label class="tb-lab">Recent withdrawals</label>
      <table class="tbl"><tr><th>Time</th><th>Method</th><th>Amount</th><th>Status</th></tr>
      ${list.map(w=>`<tr><td class="mono" style="font-size:11px">${fmtDT(w.time)}</td>
        <td>${w.method.toUpperCase()}</td><td class="mono">${money(w.amount)}</td>
        <td><span class="badge ${w.status==='processed'?'done':'pend'}">${w.status==='processed'?'SENT':'PROCESSING'}</span></td></tr>`).join('')}
      </table></div>`;
  }
  function draw(){
    app.innerHTML=shell('/withdraw',`<div class="pg narrow"><div class="pg-head"><h1>Withdraw</h1></div><div id="w-body"></div></div>`);
    wireShell();
    (async()=>{
      const txs=await API.listTx();
      const body=$('#w-body');
      if(phase==='form'){
        const bal=Auth.u?Auth.u.wallets.real:0;
        body.innerHTML=`<div class="pn">
        <label class="tb-lab">Payout method</label>
        ${METHODS.map(m=>`<button class="mrow ${m.id===method?'on':''}" data-m="${m.id}">
          <span class="mg">${m.id==='card'?icon('card',17):{mpesa:'M',usdt:'₮',btc:'₿',eth:'Ξ'}[m.id]}</span>
          <span><b>${m.name}</b><i>${m.id==='mpesa'?'to your Safaricom number':m.id==='card'?'fee 1.5%':'fee '+money(m.fee)}</i></span></button>`).join('')}
        <label class="tb-lab" style="margin-top:12px">Amount (USD) · available ${money(bal)}</label>
        <input id="w-amt" inputmode="decimal" placeholder="50.00">
        <div class="qchips">${[25,50,100,250].map(v=>`<button data-q="${v}">${v}</button>`).join('')}<button id="w-max">MAX</button></div>
        <label class="tb-lab">${method==='mpesa'?'M-Pesa phone number':'Payout address'}</label>
        <input id="w-addr" placeholder="${M().ph}">
        <div class="sum-r" style="margin-top:10px"><span>Fee</span><b id="w-fee">—</b></div>
        ${method==='mpesa'?`<div class="sum-r"><span>Approx. M-Pesa credit</span><b id="w-kes">—</b></div>`:''}
        <div class="sum-r tot"><span>You receive</span><b id="w-net">—</b></div>
        <button class="btn btn-up wide" id="w-go" style="margin-top:12px">${icon('send',14)} Request withdrawal</button>
      </div>${recentHTML(txs.filter(t=>t.type==='withdrawal').slice(0,5))}`;
        wireForm();
      }else if(phase==='track'){
        body.innerHTML=`<div class="pn"><h3 style="font-size:15px;margin-bottom:4px">Withdrawing ${money(wd.amount)} via ${wd.method.toUpperCase()}</h3>
          <p class="hint" style="margin:0 0 12px">To <b>${esc(wd.address.length>22?wd.address.slice(0,10)+'…'+wd.address.slice(-6):wd.address)}</b></p>
          <div id="wst"></div></div>`;
        const st=['Request submitted','Compliance approved',wd.method==='mpesa'?'Sending M-Pesa (B2C)':'Broadcasting payment','Sent'];
        (async()=>{for(let i=0;i<st.length;i++){
          $('#wst').innerHTML=st.map((n,j)=>
            `<div class="stg ${j<i?'done':j===i?'run':''}">${icon(j<i?'check':'clock',14)}<span>${n}</span>${j===i?'<i class="spin"></i>':''}</div>`).join('');
          await sleep(i===2?3500:2000);}
          phase='done';draw();})();
      }else{
        body.innerHTML=`<div class="pn" style="text-align:center;padding:36px 16px">
          <div class="big-check">${icon('check',28)}</div>
          <h3 style="font-size:17px;margin-bottom:4px">${money(wd.total)} sent</h3>
          <p class="hint" style="margin:0 0 18px">${money(wd.amount)} + ${money(wd.fee)} fee via ${wd.method.toUpperCase()}.</p>
          <button class="btn btn-up big" id="w-again">New withdrawal</button></div>
          ${recentHTML(txs.filter(t=>t.type==='withdrawal').slice(0,5))}`;
        $('#w-again').onclick=()=>{phase='form';wd=null;draw()};
      }
    })();
  }
  function wireForm(){
    $$('.mrow',app).forEach(b=>b.onclick=()=>{method=b.dataset.m;draw()});
    $$('.qchips button[data-q]',app).forEach(b=>b.onclick=()=>{$('#w-amt').value=b.dataset.q;calc()});
    $('#w-max').onclick=()=>{
      const bal=Auth.u.wallets.real;
      $('#w-amt').value=Math.max(0,Math.floor((method==='card'?bal/1.015:bal-feeOf(method))*100)/100);calc();};
    const calc=()=>{const a=parseFloat($('#w-amt').value)||0,f=feeOfAmt(a);
      $('#w-fee').textContent=money(f);
      $('#w-net').textContent=money(Math.max(0,a-f));
      const kes=$('#w-kes');if(kes)kes.textContent='KES '+Math.ceil((a-f)*KES_PER_USD).toLocaleString();};
    $('#w-amt').oninput=calc;calc();
    $('#w-go').onclick=async()=>{
      const a=parseFloat($('#w-amt').value)||0,addr=$('#w-addr').value.trim(),f=feeOfAmt(a);
      if(!(a>=10))return toast('warn','Too small','Minimum withdrawal is $10.00.');
      const okY=await confirmDialog({title:'Confirm withdrawal',danger:true,ok:'Send it',
        body:`Send <b>${money(a)}</b> via ${method.toUpperCase()}${method==='mpesa'?` (≈ KES ${Math.ceil((a-f)*KES_PER_USD).toLocaleString()})`:''}<br>To: <b style="word-break:break-all">${esc(addr)}</b><br><br>Fee <b>${money(f)}</b> · you receive <b>${money(a-f)}</b>. Can't be reversed.`});
      if(!okY)return;
      try{wd=await API.createWithdrawal({method,address:addr,amount:a});
        Auth.bump('real',-wd.total);
        toast('ok','Withdrawal submitted',`${money(wd.total)} deducted.`);
        phase='track';draw();
      }catch(e){toast('warn','Withdrawal rejected',e.message)}
    };
  }
  draw();
}

      :`<div class="empty">${icon('wallet',22)}<p>No transactions yet</p></div>`;

  $$('#h-tabs button').forEach(btn=>btn.onclick=()=>{tab=btn.dataset.t;
    $$('#h-tabs button').forEach(x=>x.classList.toggle('on',x===btn));draw()});

}

/* ── router ── */
const routes={'/':Terminal,'/digits':Digits,'/acca':Acca,'/scanner':Scanner,'/support':Support,
  '/deposit':Deposit,'/withdraw':Withdraw,'/history':History,'/profile':Profile};
const guarded=['/deposit','/withdraw','/history','/profile'];
function render(){
  cleanups.forEach(f=>{try{f()}catch{}});cleanups=[];
  const path=(location.hash||'#/').slice(1).split('?')[0];
  if(guarded.includes(path)&&!Auth.u){
    openAuth('register');location.hash='#/';return;
  }
  window.scrollTo(0,0);
  const app=$('#app');app.innerHTML='';
  (routes[path]||Terminal)(app);
}
window.addEventListener('hashchange',render);
(async function boot(){
