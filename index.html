<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VANTA · Binary Options Terminal</title>
<meta name="description" content="VANTA — a fast binary options terminal. Call UP or DOWN on six live markets, expiries from 30 seconds.">
<link rel="icon" href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><rect x="5.5" y="5" width="5" height="11" rx="1" fill="%23CDFF3F"/><rect x="14" y="7" width="5" height="8" rx="1" fill="%23EDEFE8"/><path d="M8 2.5v3M8 16v5M16.5 4v3M16.5 15v6" stroke="%23EDEFE8" stroke-width="1.8"/></svg>'>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;600;700;800&family=Sora:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
<style>
:root{
  --bg:#0A0C0B; --panel:#101413; --panel2:#171C1A; --line:#232926; --line2:#2F3733;
  --text:#EDEFE8; --mut:#98A093; --dim:#6D7568;
  --acc:#CDFF3F; --acc-ink:#141804;
  --up:#2DBD85; --down:#F04B5D;
  --up-ink:#0F7B53; --down-ink:#CE3548;
  --paper:#F1EDE3; --paper2:#E7E2D3; --ink:#141610; --ink2:#4A4E42; --ink3:#5A5F52;
  --fd:'Unbounded',sans-serif; --fb:'Sora',sans-serif; --fm:'JetBrains Mono',monospace;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--fb);-webkit-font-smoothing:antialiased}
a{color:inherit}
.mono{font-family:var(--fm)}
.u-c{color:var(--up)!important}.d-c{color:var(--down)!important}
.ic{flex:none;vertical-align:-3px}
::placeholder{color:var(--dim)}
input,select{font:500 14px var(--fm);color:var(--text);background:var(--panel);border:1px solid var(--line2);border-radius:10px;padding:11px 12px;outline:0;width:100%;transition:border-color .15s}
input:focus{border-color:var(--acc)}
h1,h2,h3{font-weight:600}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font:600 13.5px/1 var(--fb);padding:11px 18px;border-radius:10px;border:1px solid transparent;cursor:pointer;text-decoration:none;color:inherit;transition:transform .12s,filter .15s,border-color .15s,background .15s;white-space:nowrap}
.btn:active{transform:scale(.97)}
.btn-acc{background:var(--acc);color:var(--acc-ink)}.btn-acc:hover{filter:brightness(1.07)}
.btn-ink{background:var(--ink);color:var(--paper)}.btn-ink:hover{filter:brightness(1.3)}
.btn-ink-ghost{border-color:rgba(20,22,16,.32);color:var(--ink)}.btn-ink-ghost:hover{background:rgba(20,22,16,.07)}
.btn-ghost{border-color:var(--line2);color:var(--text)}.btn-ghost:hover{border-color:var(--mut)}
.btn-danger{background:var(--down);color:#fff}
.btn.big{padding:15px 24px;font-size:14.5px;border-radius:12px}
.btn.wide{width:100%}
.btn.sm{padding:8px 13px;font-size:12.5px}
.btn.busy{pointer-events:none;opacity:.6}
.chips{display:inline-flex;background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:3px;gap:2px}
.chips button{border:0;background:none;color:var(--mut);font:600 11.5px var(--fb);padding:6px 10px;border-radius:6px;cursor:pointer;display:inline-flex;gap:5px;align-items:center;transition:color .15s}
.chips button:hover{color:var(--text)}
.chips button.on{background:rgba(205,255,63,.12);color:var(--acc)}
.chips.wide{display:flex}.chips.wide button{flex:1;justify-content:center;padding:9px 6px}
.qchips{display:flex;gap:6px;margin:8px 0 16px}
.qchips button{flex:1;font:600 11.5px var(--fm);padding:7px 0;background:var(--panel);border:1px solid var(--line);border-radius:7px;color:var(--mut);cursor:pointer;transition:.15s}
.qchips button:hover{color:var(--acc);border-color:rgba(205,255,63,.5)}
.fld{display:block;margin-bottom:14px}
.fld>span:first-child{display:block;font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--dim);margin-bottom:6px;font-weight:600}
.fld-in{position:relative;display:flex;align-items:center}
.fld-in .ic{position:absolute;left:11px;color:var(--dim);pointer-events:none}
.fld-in input{padding-left:35px}
.pw{position:absolute;right:8px;background:none;border:0;color:var(--dim);cursor:pointer;display:flex;padding:4px}
.pw:hover{color:var(--text)}
.err{display:block;color:var(--down);font-size:11.5px;margin-top:5px;font-style:normal;min-height:0}
#toasts{position:fixed;top:14px;right:14px;z-index:300;display:flex;flex-direction:column;gap:8px;width:min(370px,calc(100vw - 28px))}
.toast{display:flex;gap:10px;align-items:flex-start;background:#121715;border:1px solid var(--line2);border-left:3px solid var(--mut);border-radius:10px;padding:11px 12px;box-shadow:0 14px 34px rgba(0,0,0,.5);animation:tin .22s cubic-bezier(.2,.9,.3,1.15)}
.toast b{font-size:13px}
.toast p{margin:3px 0 0;font-size:11.5px;color:var(--mut);line-height:1.45}
.toast .t-ic{color:var(--mut);margin-top:1px}
.toast.win{border-left-color:var(--up)}.toast.win .t-ic{color:var(--up)}
.toast.loss{border-left-color:var(--down)}.toast.loss .t-ic{color:var(--down)}
.toast.ok{border-left-color:var(--acc)}.toast.ok .t-ic{color:var(--acc)}
.toast .t-x{margin-left:auto;background:none;border:0;color:var(--dim);cursor:pointer;padding:2px}
.toast .t-x:hover{color:var(--text)}
.toast.out{animation:tout .2s forwards}
@keyframes tin{from{transform:translateX(40px);opacity:0}}
@keyframes tout{to{transform:translateX(40px);opacity:0}}
.dlgo{position:fixed;inset:0;background:rgba(6,8,7,.62);backdrop-filter:blur(4px);z-index:400;display:flex;align-items:center;justify-content:center;animation:tin .18s}
.dlg{background:var(--panel);border:1px solid var(--line2);border-radius:14px;padding:22px;width:min(430px,92vw);box-shadow:0 30px 80px rgba(0,0,0,.6)}
.dlg h3{margin:0 0 12px;font:600 16px var(--fd)}
.dlg-b{font-size:13px;color:var(--mut);line-height:1.6}
.dlg-b b{color:var(--text)}
.dlg-f{display:flex;gap:10px;justify-content:flex-end;margin-top:20px}
.brand{display:inline-flex;align-items:center;gap:9px;text-decoration:none;color:var(--text);font:700 15px var(--fd);letter-spacing:.14em}
.brand.ink{color:var(--ink)}
.topbar{height:58px;display:flex;align-items:center;gap:20px;padding:0 16px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:80}
.tnav{display:flex;gap:2px}
.tnav a{display:inline-flex;align-items:center;gap:7px;color:var(--mut);text-decoration:none;font:600 12.5px var(--fb);padding:8px 11px;border-radius:8px;transition:.15s}
.tnav a:hover{color:var(--text);background:var(--panel)}
.tnav a.on{color:var(--acc);background:rgba(205,255,63,.07)}
.tr{margin-left:auto;display:flex;align-items:center;gap:10px}
.wpill{position:relative}
.wp-btn{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line2);border-radius:10px;padding:7px 10px;cursor:pointer;color:var(--text);transition:border-color .15s}
.wp-btn:hover{border-color:var(--mut)}
.wp-tag{font:700 9.5px var(--fb);letter-spacing:.1em;padding:3px 6px;border-radius:5px}
.wp-tag.d{background:rgba(205,255,63,.14);color:var(--acc)}
.wp-tag.r{background:rgba(45,189,133,.16);color:var(--up)}
.wp-bal{font-size:13.5px;font-weight:600}
.wp-bal.bump{animation:bump .5s}
@keyframes bump{30%{transform:scale(1.14);color:var(--acc)}}
.drop{position:absolute;top:calc(100% + 8px);right:0;background:var(--panel);border:1px solid var(--line2);border-radius:12px;padding:6px;min-width:238px;z-index:90;box-shadow:0 18px 44px rgba(0,0,0,.55)}
.drop-it{display:flex;width:100%;align-items:center;gap:9px;padding:9px 10px;border:0;background:none;color:var(--text);font:500 12.5px var(--fb);border-radius:8px;cursor:pointer;text-decoration:none;text-align:left}
.drop-it:hover{background:var(--panel2)}
.drop-it.sel{background:rgba(205,255,63,.06)}
.drop-it.acc{color:var(--acc)}
.drop-it.danger{color:var(--down)}
.drop-sep{height:1px;background:var(--line);margin:5px 4px}
.um-head{padding:8px 10px;border-bottom:1px solid var(--line);margin-bottom:5px}
.um-head b{display:block;font-size:13px}
.um-head span{font-size:11.5px;color:var(--mut)}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--panel2);border:1px solid var(--line2);display:flex;align-items:center;justify-content:center;font:700 13px var(--fd);color:var(--acc);cursor:pointer}
.term{height:calc(100dvh - 58px);display:grid;grid-template-columns:250px minmax(0,1fr) 322px}
.side{border-right:1px solid var(--line);overflow:auto;display:flex;flex-direction:column}
.side-search{display:flex;align-items:center;gap:8px;padding:12px;border-bottom:1px solid var(--line);color:var(--dim)}
.side-search input{border:0;background:none;padding:4px 0;font-size:12.5px}
.ag{font:600 10px var(--fb);letter-spacing:.12em;text-transform:uppercase;color:var(--dim);padding:14px 14px 6px}
.alist{overflow:auto;padding-bottom:24px}
.ai{display:grid;grid-template-columns:1fr auto auto;gap:9px;width:100%;padding:9px 14px;background:none;border:0;border-left:2px solid transparent;color:var(--text);cursor:pointer;text-align:left;transition:.12s}
.ai:hover{background:var(--panel)}
.ai.on{background:var(--panel);border-left-color:var(--acc)}
.ai-n b{display:block;font-size:12.5px;font-weight:600}
.ai-n i{font-style:normal;font-size:10.5px;color:var(--dim)}
.ai-p{font-size:12px;text-align:right}
.ai-po{font-size:10.5px;color:var(--acc);background:rgba(205,255,63,.08);padding:2px 6px;border-radius:6px;align-self:center}
.cz{display:flex;flex-direction:column;min-width:0}
.cz-head{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line);gap:12px;flex-wrap:wrap}
.cz-id{display:flex;align-items:center;gap:12px}
.cz-id b{font-size:14.5px}
.cz-p{font-size:20px;font-weight:600;transition:color .2s}
.cz-c{font-size:12px}
.sim-tag{font:700 8.5px var(--fb);letter-spacing:.12em;color:var(--dim);border:1px solid var(--line2);padding:2px 5px;border-radius:4px}
.cz-tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.live-btn{display:inline-flex;align-items:center;gap:5px;font:700 10.5px var(--fb);letter-spacing:.08em;color:var(--dim);background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:7px 11px;cursor:pointer;transition:.15s}
.live-btn.on{color:var(--acc);border-color:rgba(205,255,63,.4)}
.cwrap{flex:1;position:relative;min-height:0;user-select:none}
.cwrap canvas{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:crosshair}
.tb{border-left:1px solid var(--line);overflow:auto;padding:14px;display:flex;flex-direction:column;gap:14px}
.empty-nudge{display:flex;gap:8px;align-items:center;background:rgba(205,255,63,.07);border:1px solid rgba(205,255,63,.25);color:var(--acc);padding:10px 12px;border-radius:10px;font-size:12px;text-decoration:none}
.tb-lab{display:block;font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--dim);margin-bottom:7px;font-weight:600}
.amt{display:flex;border:1px solid var(--line2);border-radius:10px;overflow:hidden;background:var(--panel)}
.amt input{border:0;border-radius:0;text-align:center;font-size:17px;font-weight:600;background:none;padding:10px 6px}
.amt button{width:44px;background:var(--panel2);border:0;color:var(--mut);cursor:pointer;display:flex;align-items:center;justify-content:center}
.amt button:hover{color:var(--text)}
.payout-line{display:flex;justify-content:space-between;align-items:center;border-top:1px dashed var(--line);border-bottom:1px dashed var(--line);padding:11px 2px;font-size:12px;color:var(--dim)}
.payout-line b{display:block;font-size:14.5px;color:var(--text)}
.call-put{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cp{display:flex;flex-direction:column;align-items:center;gap:3px;padding:15px 8px 12px;border:0;border-radius:12px;color:#fff;cursor:pointer;font-family:var(--fb);transition:filter .15s,transform .1s}
.cp:hover{filter:brightness(1.09)}
.cp:active{transform:scale(.97)}
.cp b{font:700 16px var(--fd);letter-spacing:.04em}
.cp span{font-size:9.5px;opacity:.85}
.cp.up{background:var(--up)}
.cp.down{background:var(--down)}
.pos-head{display:flex;justify-content:space-between;align-items:center}
.pos-head span{font:600 11px var(--fm);color:var(--dim)}
.pos-r{display:grid;grid-template-columns:auto 1fr auto auto;gap:9px;align-items:center;padding:10px 2px;border-bottom:1px solid var(--line);font-size:11.5px;position:relative}
.pos-r:last-child{border:0}
.dir{width:24px;height:24px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:11px}
.dir.up{background:rgba(45,189,133,.15);color:var(--up)}
.dir.down{background:rgba(240,75,93,.15);color:var(--down)}
.pos-i b{display:block;font-size:12px}
.pos-i i{font-style:normal;color:var(--dim);font-size:10.5px}
.pos-s{font:600 10.5px var(--fb)}
.pos-s.w{color:var(--up)}.pos-s.l{color:var(--down)}
.pos-t{font-size:11px;color:var(--mut)}
.pos-bar{position:absolute;left:34px;bottom:3px;height:2px;width:calc(100% - 110px);background:var(--line)}
.pos-bar i{display:block;height:100%;background:var(--acc)}
.pos-acc{font:600 8.5px var(--fb);letter-spacing:.08em;color:var(--dim);border:1px solid var(--line2);padding:1px 4px;border-radius:4px;font-style:normal}
.day-stats{display:flex;gap:12px;align-items:center;border-top:1px solid var(--line);padding-top:12px;font-size:11px;color:var(--dim);flex-wrap:wrap}
.day-stats b{font-size:11.5px;color:var(--text);font-weight:600}
.pg{max-width:1080px;margin:0 auto;padding:28px 20px 70px}
.pg.narrow{max-width:640px}
.pg-head{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:22px}
.pg-head h1{margin:0;font:600 23px var(--fd)}
.steps{display:flex;gap:8px;font:600 11px var(--fm);color:var(--dim)}
.steps span.on{color:var(--acc)}
.pn{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px}
.tbl{width:100%;border-collapse:collapse;font-size:12.5px}
.tbl th{font:600 10px var(--fb);letter-spacing:.09em;text-transform:uppercase;color:var(--dim);text-align:left;padding:10px 12px;border-bottom:1px solid var(--line)}
.tbl td{padding:11px 12px;border-bottom:1px solid var(--line)}
.tbl tr:last-child td{border:0}
.badge{font:700 9.5px var(--fb);letter-spacing:.07em;padding:3px 8px;border-radius:6px;white-space:nowrap}
.badge.win{background:rgba(45,189,133,.14);color:var(--up)}
.badge.loss{background:rgba(240,75,93,.14);color:var(--down)}
.badge.open{background:rgba(205,255,63,.12);color:var(--acc)}
.badge.pend{background:rgba(255,255,255,.07);color:var(--mut)}
.badge.done{background:rgba(45,189,133,.14);color:var(--up)}
.empty{padding:44px 20px;text-align:center;color:var(--dim)}
.empty .ic{opacity:.55;margin-bottom:10px}
.empty p{margin:0 0 4px;font-weight:600;color:var(--mut);font-size:13.5px}
.empty span{font-size:12px}
.spin{margin-left:auto;width:12px;height:12px;border:2px solid var(--line2);border-top-color:var(--acc);border-radius:50%;animation:rot .7s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
.dep-grid{display:grid;grid-template-columns:1.15fr .85fr;gap:20px;align-items:start}
.mrow{display:flex;align-items:center;gap:12px;width:100%;padding:13px 14px;background:var(--bg);border:1px solid var(--line2);border-radius:12px;cursor:pointer;margin-bottom:8px;color:var(--text);text-align:left;transition:.15s}
.mrow:hover{border-color:var(--mut)}
.mrow.on{border-color:var(--acc);background:rgba(205,255,63,.05)}
.mg{width:38px;height:38px;border-radius:10px;background:var(--panel2);display:flex;align-items:center;justify-content:center;font:700 17px var(--fm);color:var(--acc);flex:none}
.mrow b{display:block;font-size:13.5px}
.mrow i{font-style:normal;font-size:11.5px;color:var(--mut)}
.mrow .mnote{margin-left:auto;font:500 11px var(--fm);color:var(--dim)}
.mrow.on .mnote{color:var(--acc)}
.sum-r{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px dashed var(--line);font-size:12.5px}
.sum-r span{color:var(--mut)}
.sum-r b{font-family:var(--fm);font-weight:600}
.sum-r.tot{border:0;padding-top:14px;font-size:14px}
.sum-r.tot b{color:var(--acc);font-size:17px}
.qrbox{background:var(--paper);border-radius:12px;padding:12px;width:fit-content;margin:6px auto 14px}
.addr{display:flex;align-items:center;gap:8px;background:var(--bg);border:1px dashed var(--line2);border-radius:10px;padding:10px 12px;margin-bottom:10px}
.addr code{font:500 12px var(--fm);color:var(--text);word-break:break-all;flex:1}
.addr button{background:none;border:0;color:var(--acc);cursor:pointer;display:flex;padding:3px}
.stg{display:flex;align-items:center;gap:10px;padding:11px 2px;color:var(--dim);font-size:13px;border-bottom:1px dashed var(--line)}
.stg:last-child{border:0}
.stg.done{color:var(--text)}.stg.done .ic{color:var(--up)}
.stg.run{color:var(--acc)}.stg.run .ic{color:var(--acc)}
.big-check{width:64px;height:64px;border-radius:50%;background:var(--up);color:#08120D;display:flex;align-items:center;justify-content:center;margin:0 auto 18px}
.card-f{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card-f .full{grid-column:1/-1}
.hint{font-size:11.5px;color:var(--dim);line-height:1.55;margin:8px 0 0}
.hint b{color:var(--acc);font-family:var(--fm);font-weight:600}
.prof{display:grid;grid-template-columns:330px 1fr;gap:20px;align-items:start}
.prof-id{display:flex;gap:14px;align-items:center;margin-bottom:16px}
.prof-av{width:56px;height:56px;border-radius:50%;background:var(--panel2);border:1px solid var(--line2);display:flex;align-items:center;justify-content:center;font:700 20px var(--fd);color:var(--acc)}
.stat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.stat{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:14px}
.stat span{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);font-weight:600}
.stat b{display:block;font:600 21px var(--fm);margin-top:6px}
.land{background:var(--paper);color:var(--ink);min-height:100dvh}
.lnav{display:flex;align-items:center;gap:34px;padding:18px 6vw;border-bottom:1px solid rgba(20,22,16,.12)}
.lnav nav{display:flex;gap:24px}
.lnav nav a{text-decoration:none;font:600 13px var(--fb);color:var(--ink2)}
.lnav nav a:hover{color:var(--ink)}
.lnav-r{margin-left:auto;display:flex;gap:10px}
.hero{display:grid;grid-template-columns:1.05fr .95fr;gap:56px;padding:84px 6vw 72px;align-items:center}
.eyebrow{font:600 11px var(--fm);letter-spacing:.14em;color:var(--ink3);display:flex;align-items:center;margin:0}
.dot{width:7px;height:7px;border-radius:50%;background:var(--up-ink);display:inline-block;margin-right:9px;animation:pls 1.6s infinite}
@keyframes pls{50%{opacity:.25}}
.hero h1{font:800 clamp(46px,7vw,94px)/0.98 var(--fd);letter-spacing:-.015em;margin:20px 0 22px}
.up-t{color:var(--up-ink)}.down-t{color:var(--down-ink)}
.lede{font-size:16.5px;line-height:1.65;color:#3F4438;max-width:540px;margin:0 0 30px}
.lede b{color:var(--ink)}
.hero-cta{display:flex;gap:12px;flex-wrap:wrap}
.fine{font-size:12px;color:var(--ink3);margin:16px 0 0}
.herocard{background:#0B0D0C;color:var(--text);border-radius:18px;padding:16px;box-shadow:0 30px 80px rgba(20,22,16,.28);border:1px solid rgba(20,22,16,.4)}
.hc-head{display:flex;justify-content:space-between;align-items:flex-start;padding:2px 4px 12px}
.hc-head b{font-size:14px}
.hc-sub{display:block;font:600 9.5px var(--fb);letter-spacing:.12em;color:var(--dim);margin-top:4px}
.hc-price{font-size:20px;font-weight:600;transition:color .2s}
