<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>VANTA · Binary Options Terminal</title>
<link rel="icon" href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><rect x="5.5" y="5" width="5" height="11" rx="1" fill="%23CDFF3F"/><rect x="14" y="7" width="5" height="8" rx="1" fill="%23EDEFE8"/><path d="M8 2.5v3M8 16v5M16.5 4v3M16.5 15v6" stroke="%23EDEFE8" stroke-width="1.8"/></svg>'>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;600;700;800&family=Sora:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
<style>
:root{
  --bg:#0A0C0B; --panel:#101413; --panel2:#171C1A; --line:#232926; --line2:#2F3733;
  --text:#EDEFE8; --mut:#98A093; --dim:#6D7568;
  --acc:#CDFF3F; --acc-ink:#141804;
  --up:#2DBD85; --down:#F04B5D;
  --up-ink:#0F7B53; --down-ink:#CE3548;
  --paper:#F1EDE3; --ink:#141610; --ink2:#4A4E42; --ink3:#5A5F52;
  --fd:'Unbounded',sans-serif; --fb:'Sora',sans-serif; --fm:'JetBrains Mono',monospace;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--fb);-webkit-font-smoothing:antialiased}
a{color:inherit}
.mono{font-family:var(--fm)}
.u-c{color:var(--up)!important}.d-c{color:var(--down)!important}
.ic{flex:none;vertical-align:-3px}
::placeholder{color:var(--dim)}
input,select{font:500 15px var(--fm);color:var(--text);background:var(--panel);border:1px solid var(--line2);border-radius:10px;padding:12px;outline:0;width:100%;transition:border-color .15s}
input:focus{border-color:var(--acc)}
h1,h2,h3{font-weight:600}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font:600 14px/1 var(--fb);padding:13px 18px;border-radius:11px;border:1px solid transparent;cursor:pointer;text-decoration:none;color:inherit;transition:transform .12s,filter .15s;white-space:nowrap}
.btn:active{transform:scale(.97)}
.btn-acc{background:var(--acc);color:var(--acc-ink)}.btn-acc:hover{filter:brightness(1.07)}
.btn-ink{background:var(--ink);color:var(--paper)}
.btn-ink-ghost{border-color:rgba(20,22,16,.32);color:var(--ink)}
.btn-ghost{border-color:var(--line2);color:var(--text)}.btn-ghost:hover{border-color:var(--mut)}
.btn-danger{background:var(--down);color:#fff}
.btn.big{padding:16px 24px;font-size:15px;border-radius:13px}
.btn.wide{width:100%}
.btn.sm{padding:9px 13px;font-size:12.5px}
.btn.busy{pointer-events:none;opacity:.6}
.chips{display:inline-flex;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px}
.chips button{border:0;background:none;color:var(--mut);font:600 12px var(--fb);padding:8px 12px;border-radius:7px;cursor:pointer;display:inline-flex;gap:5px;align-items:center}
.chips button.on{background:rgba(205,255,63,.12);color:var(--acc)}
.chips.wide{display:flex}.chips.wide button{flex:1;justify-content:center}
.qchips{display:flex;gap:6px;margin:8px 0 16px}
.qchips button{flex:1;font:600 12px var(--fm);padding:9px 0;background:var(--panel);border:1px solid var(--line);border-radius:8px;color:var(--mut);cursor:pointer}
.qchips button:hover{color:var(--acc)}
.fld{display:block;margin-bottom:14px}
.fld>span:first-child{display:block;font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--dim);margin-bottom:6px;font-weight:600}
.fld-in{position:relative;display:flex;align-items:center}
.fld-in .ic{position:absolute;left:11px;color:var(--dim);pointer-events:none}
.fld-in input{padding-left:35px}
.pw{position:absolute;right:8px;background:none;border:0;color:var(--dim);cursor:pointer;display:flex;padding:4px}
.err{display:block;color:var(--down);font-size:11.5px;margin-top:5px;font-style:normal}
#toasts{position:fixed;top:14px;right:14px;z-index:300;display:flex;flex-direction:column;gap:8px;width:min(370px,calc(100vw - 28px))}
.toast{display:flex;gap:10px;align-items:flex-start;background:#121715;border:1px solid var(--line2);border-left:3px solid var(--mut);border-radius:10px;padding:11px 12px;box-shadow:0 14px 34px rgba(0,0,0,.5);animation:tin .22s cubic-bezier(.2,.9,.3,1.15)}
.toast b{font-size:13px}
.toast p{margin:3px 0 0;font-size:11.5px;color:var(--mut);line-height:1.45}
.toast .t-ic{color:var(--mut);margin-top:1px}
.toast.win{border-left-color:var(--up)}.toast.win .t-ic{color:var(--up)}
.toast.loss{border-left-color:var(--down)}.toast.loss .t-ic{color:var(--down)}
.toast.ok{border-left-color:var(--acc)}.toast.ok .t-ic{color:var(--acc)}
.toast .t-x{margin-left:auto;background:none;border:0;color:var(--dim);cursor:pointer;padding:2px}
.toast.out{animation:tout .2s forwards}
@keyframes tin{from{transform:translateX(40px);opacity:0}}
@keyframes tout{to{transform:translateX(40px);opacity:0}}
.dlgo{position:fixed;inset:0;background:rgba(6,8,7,.62);backdrop-filter:blur(4px);z-index:400;display:flex;align-items:center;justify-content:center}
.dlg{background:var(--panel);border:1px solid var(--line2);border-radius:14px;padding:22px;width:min(430px,92vw);box-shadow:0 30px 80px rgba(0,0,0,.6)}
.dlg h3{margin:0 0 12px;font:600 16px var(--fd)}
.dlg-b{font-size:13px;color:var(--mut);line-height:1.6}
.dlg-b b{color:var(--text)}
.dlg-f{display:flex;gap:10px;justify-content:flex-end;margin-top:20px}
.brand{display:inline-flex;align-items:center;gap:9px;text-decoration:none;color:var(--text);font:700 13px var(--fd);letter-spacing:.1em}
.brand.ink{color:var(--ink)}
.topbar{height:56px;display:flex;align-items:center;gap:12px;padding:0 12px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:80}
.tnav{display:flex;gap:2px}
.tnav a{display:inline-flex;align-items:center;gap:7px;color:var(--mut);text-decoration:none;font:600 12.5px var(--fb);padding:8px 11px;border-radius:8px}
.tnav a.on{color:var(--acc);background:rgba(205,255,63,.07)}
.tr{margin-left:auto;display:flex;align-items:center;gap:8px}
.wpill{position:relative}
.wp-btn{display:flex;align-items:center;gap:7px;background:var(--panel);border:1px solid var(--line2);border-radius:10px;padding:7px 9px;cursor:pointer;color:var(--text)}
.wp-tag{font:700 9px var(--fb);letter-spacing:.1em;padding:3px 5px;border-radius:5px}
.wp-tag.d{background:rgba(205,255,63,.14);color:var(--acc)}
.wp-tag.r{background:rgba(45,189,133,.16);color:var(--up)}
.wp-bal{font-size:13px;font-weight:600}
.wp-bal.bump{animation:bump .5s}
@keyframes bump{30%{transform:scale(1.14);color:var(--acc)}}
.drop{position:absolute;top:calc(100% + 8px);right:0;background:var(--panel);border:1px solid var(--line2);border-radius:12px;padding:6px;min-width:230px;z-index:90;box-shadow:0 18px 44px rgba(0,0,0,.55)}
.drop-it{display:flex;width:100%;align-items:center;gap:9px;padding:10px;border:0;background:none;color:var(--text);font:500 12.5px var(--fb);border-radius:8px;cursor:pointer;text-decoration:none;text-align:left}
.drop-it:hover{background:var(--panel2)}
.drop-it.sel{background:rgba(205,255,63,.06)}
.drop-it.acc{color:var(--acc)}
.drop-it.danger{color:var(--down)}
.drop-sep{height:1px;background:var(--line);margin:5px 4px}
.um-head{padding:8px 10px;border-bottom:1px solid var(--line);margin-bottom:5px}
.um-head b{display:block;font-size:13px}
.um-head span{font-size:11.5px;color:var(--mut)}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--panel2);border:1px solid var(--line2);display:flex;align-items:center;justify-content:center;font:700 13px var(--fd);color:var(--acc);cursor:pointer}
.bnav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--panel);border-top:1px solid var(--line);z-index:85;padding-bottom:env(safe-area-inset-bottom)}
.bnav a{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0 8px;color:var(--dim);text-decoration:none;font:600 9.5px var(--fb)}
.bnav a.on{color:var(--acc)}
.term{display:flex;flex-direction:column;min-height:calc(100dvh - 56px)}
.aside-assets{border-bottom:1px solid var(--line);background:var(--bg)}
.alist{display:flex;overflow-x:auto;gap:8px;padding:10px 12px;scrollbar-width:none}
.alist::-webkit-scrollbar{display:none}
.ag{display:none}
.ai{flex:none;min-width:124px;display:flex;flex-direction:column;gap:3px;padding:9px 11px;background:var(--panel);border:1px solid var(--line);border-radius:12px;color:var(--text);cursor:pointer;text-align:left}
.ai.on{border-color:var(--acc);background:rgba(205,255,63,.06)}
.ai-n b{font-size:12.5px;font-weight:600;display:block;white-space:nowrap}
.ai-n i{font-style:normal;font-size:9.5px;color:var(--dim);display:none}
.ai-row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.ai-p{font-size:11.5px}
.ai-po{font-size:10px;color:var(--acc);background:rgba(205,255,63,.08);padding:2px 5px;border-radius:5px}
.cwrap{position:relative;height:42vh;min-height:240px;user-select:none;border-bottom:1px solid var(--line)}
.cwrap canvas{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:crosshair}
.cz-head{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line);gap:10px}
.cz-id{display:flex;align-items:center;gap:10px;min-width:0}
.cz-id b{font-size:14px;white-space:nowrap}
.cz-p{font-size:17px;font-weight:600}
.cz-c{font-size:11px}
.sim-tag{font:700 8.5px var(--fb);letter-spacing:.1em;color:var(--dim);border:1px solid var(--line2);padding:2px 5px;border-radius:4px;white-space:nowrap}
.sim-tag.ok{color:var(--acc);border-color:rgba(205,255,63,.4)}
.sim-tag.bad{color:var(--down);border-color:rgba(240,75,93,.4)}
.cz-tools{display:flex;gap:8px;align-items:center}
.tb{padding:14px 14px 90px;display:flex;flex-direction:column;gap:14px}
.tb-lab{display:block;font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--dim);margin-bottom:7px;font-weight:600}
.amt{display:flex;border:1px solid var(--line2);border-radius:12px;overflow:hidden;background:var(--panel)}
.amt input{border:0;border-radius:0;text-align:center;font-size:20px;font-weight:600;background:none;padding:12px 6px}
.amt button{width:52px;background:var(--panel2);border:0;color:var(--mut);cursor:pointer;display:flex;align-items:center;justify-content:center}
.payout-line{display:flex;justify-content:space-between;align-items:center;border-top:1px dashed var(--line);border-bottom:1px dashed var(--line);padding:11px 2px;font-size:12px;color:var(--dim)}
.payout-line b{display:block;font-size:14.5px;color:var(--text)}
.call-put{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cp{display:flex;flex-direction:column;align-items:center;gap:3px;padding:17px 8px 13px;border:0;border-radius:13px;color:#fff;cursor:pointer;font-family:var(--fb);transition:opacity .2s,transform .1s}
.cp:disabled{opacity:.45;pointer-events:none}
.cp:active{transform:scale(.97)}
.cp b{font:700 17px var(--fd)}
.cp span{font-size:9px;opacity:.85}
.cp.up{background:var(--up)}
.cp.down{background:var(--down)}
.pos-head{display:flex;justify-content:space-between;align-items:center}
.pos-head span{font:600 11px var(--fm);color:var(--dim)}
.pos-r{display:grid;grid-template-columns:auto 1fr auto auto;gap:9px;align-items:center;padding:10px 2px;border-bottom:1px solid var(--line);font-size:11.5px;position:relative}
.pos-r:last-child{border:0}
.dir{width:24px;height:24px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:11px}
.dir.up{background:rgba(45,189,133,.15);color:var(--up)}
.dir.down{background:rgba(240,75,93,.15);color:var(--down)}
.pos-i b{display:block;font-size:12px}
.pos-i i{font-style:normal;color:var(--dim);font-size:10.5px}
.pos-s{font:600 10.5px var(--fb)}
.pos-s.w{color:var(--up)}.pos-s.l{color:var(--down)}
.pos-t{font-size:11px;color:var(--mut)}
.pos-bar{position:absolute;left:34px;bottom:3px;height:2px;width:calc(100% - 110px);background:var(--line)}
.pos-bar i{display:block;height:100%;background:var(--acc)}
.pos-acc{font:600 8.5px var(--fb);letter-spacing:.08em;color:var(--dim);border:1px solid var(--line2);padding:1px 4px;border-radius:4px;font-style:normal}
.day-stats{display:flex;gap:12px;align-items:center;border-top:1px solid var(--line);padding-top:12px;font-size:11px;color:var(--dim);flex-wrap:wrap}
.day-stats b{font-size:11.5px;color:var(--text);font-weight:600}
.pg{max-width:1080px;margin:0 auto;padding:20px 16px 90px}
.pg.narrow{max-width:640px}
.pg-head{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:18px}
.pg-head h1{margin:0;font:600 20px var(--fd)}
.steps{display:flex;gap:8px;font:600 10.5px var(--fm);color:var(--dim)}
.steps span.on{color:var(--acc)}
.pn{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px}
.tbl{width:100%;border-collapse:collapse;font-size:12px}
.tbl th{font:600 9.5px var(--fb);letter-spacing:.09em;text-transform:uppercase;color:var(--dim);text-align:left;padding:9px 10px;border-bottom:1px solid var(--line)}
.tbl td{padding:10px 10px;border-bottom:1px solid var(--line)}
.tbl tr:last-child td{border:0}
.badge{font:700 9px var(--fb);letter-spacing:.07em;padding:3px 7px;border-radius:6px;white-space:nowrap}
.badge.win{background:rgba(45,189,133,.14);color:var(--up)}
.badge.loss{background:rgba(240,75,93,.14);color:var(--down)}
.badge.open{background:rgba(205,255,63,.12);color:var(--acc)}
.badge.pend{background:rgba(255,255,255,.07);color:var(--mut)}
.badge.done{background:rgba(45,189,133,.14);color:var(--up)}
.empty{padding:40px 20px;text-align:center;color:var(--dim)}
.empty .ic{opacity:.55;margin-bottom:10px}
.empty p{margin:0 0 4px;font-weight:600;color:var(--mut);font-size:13.5px}
.empty span{font-size:12px}
.spin{margin-left:auto;width:12px;height:12px;border:2px solid var(--line2);border-top-color:var(--acc);border-radius:50%;animation:rot .7s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
.dep-grid{display:grid;grid-template-columns:1fr;gap:16px}
.mrow{display:flex;align-items:center;gap:12px;width:100%;padding:13px 14px;background:var(--bg);border:1px solid var(--line2);border-radius:12px;cursor:pointer;margin-bottom:8px;color:var(--text);text-align:left}
.mrow.on{border-color:var(--acc);background:rgba(205,255,63,.05)}
.mg{width:38px;height:38px;border-radius:10px;background:var(--panel2);display:flex;align-items:center;justify-content:center;font:700 17px var(--fm);color:var(--acc);flex:none}
.mrow b{display:block;font-size:13.5px}
.mrow i{font-style:normal;font-size:11.5px;color:var(--mut)}
.mrow .mnote{margin-left:auto;font:500 10.5px var(--fm);color:var(--dim)}
.mrow.on .mnote{color:var(--acc)}
.sum-r{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px dashed var(--line);font-size:12.5px}
.sum-r span{color:var(--mut)}
.sum-r b{font-family:var(--fm);font-weight:600}
.sum-r.tot{border:0;padding-top:14px;font-size:14px}
.sum-r.tot b{color:var(--acc);font-size:17px}
.qrbox{background:var(--paper);border-radius:12px;padding:12px;width:fit-content;margin:6px auto 14px}
.addr{display:flex;align-items:center;gap:8px;background:var(--bg);border:1px dashed var(--line2);border-radius:10px;padding:10px 12px;margin-bottom:10px}
.addr code{font:500 11.5px var(--fm);color:var(--text);word-break:break-all;flex:1}
.addr button{background:none;border:0;color:var(--acc);cursor:pointer;display:flex;padding:3px}
.stg{display:flex;align-items:center;gap:10px;padding:11px 2px;color:var(--dim);font-size:13px;border-bottom:1px dashed var(--line)}
.stg:last-child{border:0}
.stg.done{color:var(--text)}.stg.done .ic{color:var(--up)}
.stg.run{color:var(--acc)}.stg.run .ic{color:var(--acc)}
.big-check{width:64px;height:64px;border-radius:50%;background:var(--up);color:#08120D;display:flex;align-items:center;justify-content:center;margin:0 auto 18px}
.card-f{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card-f .full{grid-column:1/-1}
.hint{font-size:11.5px;color:var(--dim);line-height:1.55;margin:8px 0 0}
.hint b{color:var(--acc);font-family:var(--fm);font-weight:600}
.prof{display:grid;grid-template-columns:1fr;gap:16px}
.prof-id{display:flex;gap:14px;align-items:center;margin-bottom:16px}
.prof-av{width:56px;height:56px;border-radius:50%;background:var(--panel2);border:1px solid var(--line2);display:flex;align-items:center;justify-content:center;font:700 20px var(--fd);color:var(--acc)}
.stat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.stat{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:14px}
.stat span{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);font-weight:600}
.stat b{display:block;font:600 19px var(--fm);margin-top:6px}
/* digits */
.dg-strip{display:flex;gap:6px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
.dg-strip::-webkit-scrollbar{display:none}
.dg-d{width:38px;height:38px;flex:none;border-radius:9px;display:flex;align-items:center;justify-content:center;font:700 15px var(--fm);background:var(--panel);border:1px solid var(--line)}
.dg-d.e{color:var(--up)}.dg-d.o{color:var(--down)}
.dg-pick{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:8px 0 14px}
.dg-pick button{padding:13px 0;font:700 16px var(--fm);background:var(--panel);border:1px solid var(--line2);border-radius:10px;color:var(--mut);cursor:pointer}
.dg-pick button.on{border-color:var(--acc);color:var(--acc);background:rgba(205,255,63,.07)}
/* acca */
.leg{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px;background:var(--bg);border:1px solid var(--line2);border-radius:10px;margin-bottom:8px}
.leg b{font-size:12.5px}
.leg i{font-style:normal;font-size:10px;color:var(--dim);display:block}
.dirpick{display:flex;gap:6px}
.dirpick button{padding:8px 13px;border-radius:8px;border:1px solid var(--line2);background:none;color:var(--mut);font:700 11px var(--fb);cursor:pointer}
.dirpick button.on.up{background:var(--up);color:#fff;border-color:var(--up)}
.dirpick button.on.down{background:var(--down);color:#fff;border-color:var(--down)}
/* scanner */
.scan-it{background:var(--bg);border:1px solid var(--line2);border-radius:12px;padding:13px;margin-bottom:10px}
.scan-top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.scan-top b{font-size:13.5px}
.scan-sig{font:700 10.5px var(--fb);padding:4px 9px;border-radius:7px}
.scan-sig.up{background:rgba(45,189,133,.15);color:var(--up)}
.scan-sig.down{background:rgba(240,75,93,.15);color:var(--down)}
.scan-sig.dg{background:rgba(205,255,63,.12);color:var(--acc)}
.scan-sig.n{background:rgba(255,255,255,.06);color:var(--mut)}
.scan-bar{height:4px;background:var(--line);border-radius:3px;margin:10px 0 7px;overflow:hidden}
.scan-bar i{display:block;height:100%;background:var(--acc)}
.scan-why{font-size:11.5px;color:var(--mut);line-height:1.5}
/* support */
.chat{display:flex;flex-direction:column;gap:10px;min-height:44vh;padding:4px 0}
.msg{max-width:82%;padding:10px 13px;border-radius:13px;font-size:13.5px;line-height:1.55;white-space:pre-wrap}
.msg.me{align-self:flex-end;background:var(--acc);color:var(--acc-ink);border-bottom-right-radius:4px}
.msg.bot{align-self:flex-start;background:var(--panel);border:1px solid var(--line);border-bottom-left-radius:4px}
.chat-in{display:flex;gap:8px;margin-top:6px}
.chat-in input{flex:1}
/* landing + auth */

const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtDT=t=>{const d=new Date(t);return d.toLocaleDateString('en-US',{month:'short',day:'numeric'})+' '+d.toTimeString().slice(0,5)};

function gauss(){let u=0,v=0;while(!u)u=Math.random();while(!v)v=Math.random();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v)}
function niceStep(x){const p=Math.pow(10,Math.floor(Math.log10(x)));const n=x/p;return (n<1.5?1:n<3?2:n<7?5:10)*p}
function luhn(s){let sum=0,alt=false;for(let i=s.length-1;i>=0;i--){let n=+s[i];if(alt){n*=2;if(n>9)n-=9}sum+=n;alt=!alt}return sum%10===0}
const Bus={m:{},on(e,f){(this.m[e]??=[]).push(f);return()=>{this.m[e]=(this.m[e]||[]).filter(x=>x!==f)}},emit(e,d){(this.m[e]||[]).forEach(f=>{try{f(d)}catch{}})}};

const icon=(n,s=18,cls='')=>`<svg class="ic ${cls}" width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">${I[n]||''}</svg>`;

const TT={win:['up','up'],loss:['down','down'],ok:['check','up'],warn:['warn','down'],info:['info','']};
function toast(type,title,msg=''){
  const box=$('#toasts');const t=document.createElement('div');
  const[ic,c]=TT[type]||TT.info;
  t.className='toast '+(c?'t-'+c:'');
  t.innerHTML=`<span class="t-ic">${icon(ic,16)}</span><div><b>${esc(title)}</b>${msg?`<p>${esc(msg)}</p>`:''}</div><button class="t-x">${icon('x',13)}</button>`;
  box.prepend(t);
  const kill=()=>{t.classList.add('out');setTimeout(()=>t.remove(),220)};
  t.querySelector('.t-x').onclick=kill;setTimeout(kill,4800);
}
function confirmDialog({title,body,ok='Confirm',danger=false}){
  return new Promise(res=>{
    const ov=document.createElement('div');ov.className='dlgo';
    ov.innerHTML=`<div class="dlg"><h3>${esc(title)}</h3><div class="dlg-b">${body}</div>
      <div class="dlg-f"><button class="btn btn-ghost" data-a="no">Cancel</button>
      <button class="btn ${danger?'btn-danger':'btn-acc'}" data-a="ok">${esc(ok)}</button></div></div>`;
    ov.addEventListener('click',e=>{
      const a=e.target.closest('[data-a]')?.dataset.a;
      if(a){ov.remove();res(a==='ok')}else if(e.target===ov){ov.remove();res(false)}

const FEED=[
  {id:'EURUSD',name:'EUR/USD',cat:'Forex',start:1.08423,vol:0.00006,dec:5,payout:85},
  {id:'GBPUSD',name:'GBP/USD',cat:'Forex',start:1.27164,vol:0.00009,dec:5,payout:83},
  {id:'USDJPY',name:'USD/JPY',cat:'Forex',start:154.281,vol:0.011,dec:3,payout:82},
  {id:'BTCUSD',name:'BTC/USD',cat:'Crypto',start:67432,vol:16,dec:0,payout:88},
  {id:'ETHUSD',name:'ETH/USD',cat:'Crypto',start:3418.4,vol:1.2,dec:1,payout:86},
  {id:'XAUUSD',name:'GOLD',cat:'Commodity',start:2382.6,vol:0.5,dec:2,payout:84},
];
const lastDigit=a=>{const s=(+a.price).toFixed(a.dec);return +s[s.length-1]};
const digitMult=(option,t)=>{
  const prob=option==='even'||option==='odd'?.5
    :option==='over'?(9-t)/10:option==='under'?t/10
    :option==='match'?.1:.9;
  return Math.max(1.01,Math.floor((0.95/prob)*100)/100)};
const Market={
  A:FEED.map(a=>({...a,price:a.start,drift:0,dir:1,ticks:[]})),
  _cc:{},subs:new Set(),_pb:false,_synced:false,connected:USE_DEMO,lastOk:0,
  init(){
    if(USE_DEMO){
      const now=Date.now();
      this.A.forEach(a=>{let p=a.start;const t0=now-65*60*1000;
        for(let t=t0;t<now;t+=1000){p=this.step(a,p);a.ticks.push({t,p});}
        a.price=p;});
    }
    setInterval(()=>this.tick(),USE_DEMO?400:1000);
  },
  step(a,p){
    if(Math.random()<0.03)a.drift=(Math.random()-0.5)*a.vol*0.9;
    const pull=(a.start-p)/a.start*a.vol*0.35;
    return Math.max(a.start*0.3,p+a.drift+a.vol*gauss()+pull);
  },
  tick(){
    if(!USE_DEMO){this.pullRemote();
      if(this.connected&&Date.now()-this.lastOk>8000){this.connected=false;this.subs.forEach(f=>f());}
      return}
    const t=Date.now();
    this.A.forEach(a=>{const p=this.step(a,a.price);
      a.dir=p>a.price?1:p<a.price?-1:a.dir;a.price=p;
      a.ticks.push({t,p});if(a.ticks.length>4200)a.ticks.splice(0,a.ticks.length-4200);});
    this.subs.forEach(f=>f());
  },
  async pullRemote(){
    if(this._pb)return;this._pb=true;
    try{
      const r=await API.prices(),t=r.t||Date.now();
      for(const id in r.p){
        const a=this.byId(id);if(!a)continue;
        const p=+r.p[id];if(!p)continue;
        if(!this._synced){
          let q=p;const hist=[],t0=t-65*60*1000;
          for(let tt=t0;tt<t;tt+=1000){q=this.step(a,q);hist.push({t:tt,p:q});}
          hist.push({t,p});
          a.ticks=hist;a.price=p;a.dir=1;
        }else{
          a.dir=p>a.price?1:p<a.price?-1:a.dir;a.price=p;
          a.ticks.push({t,p});if(a.ticks.length>4200)a.ticks.splice(0,a.ticks.length-4200);
        }
      }
      this._synced=true;
      if(!this.connected){this.connected=true;toast('ok','Connected','Live prices streaming from the server.');}
      this.lastOk=Date.now();
      this.subs.forEach(f=>f());
    }catch{}
    this._pb=false;
  },
  on(f){this.subs.add(f);return()=>this.subs.delete(f)},
  byId(id){return this.A.find(a=>a.id===id)},
  _build(a,tf){
    const out=[];let cur=null;
    for(const k of a.ticks){const b=Math.floor(k.t/(tf*1000))*(tf*1000);
      if(!cur||cur.t!==b){if(cur)out.push(cur);cur={t:b,o:k.p,h:k.p,l:k.p,c:k.p};}
      else{if(k.p>cur.h)cur.h=k.p;if(k.p<cur.l)cur.l=k.p;cur.c=k.p;}}
    if(cur)out.push(cur);return out;
  },
  candles(a,tf,cnt){
    const key=a.id+'|'+tf,now=Date.now();let e=this._cc[key];
    if(!e||now-e.at>200){e=this._cc[key]={at:now,arr:this._build(a,tf)};}
    return cnt?e.arr.slice(-cnt):e.arr;
  },
  fmtP(a,p=a.price){return (+p).toLocaleString('en-US',{minimumFractionDigits:a.dec,maximumFractionDigits:a.dec})},
};

const CC={bg:'#0A0C0B',grid:'rgba(237,239,232,.09)',gridS:'rgba(237,239,232,.045)',
  text:'#EDEFE8',mut:'#98A093',dim:'#6D7568',up:'#2DBD85',down:'#F04B5D',acc:'#CDFF3F'};
function rr(c,x,y,w,h,rad){c.beginPath();c.moveTo(x+rad,y);c.arcTo(x+w,y,x+w,y+h,rad);c.arcTo(x+w,y+h,x,y+h,rad);c.arcTo(x,y+h,x,y,rad);c.arcTo(x,y,x+w,y,rad);c.closePath()}
class Chart{
  constructor(cv,o){
    this.cv=cv;this.ctx=cv.getContext('2d');this.o=Object.assign({compact:false,trades:null,pulses:null},o);
    this.slot=9;this.offset=0;this.ease=null;this.drag=null;this.mouse=null;this.dead=false;
    this.ro=new ResizeObserver(()=>this.rs());this.ro.observe(cv.parentElement);this.rs();
    cv.addEventListener('mousemove',e=>{const r=cv.getBoundingClientRect();
      this.mouse={x:e.clientX-r.left,y:e.clientY-r.top};
      if(this.drag)this.offset=clamp(this.drag.off+(e.clientX-this.drag.x)/this.slot,0,this.maxOff());});
    cv.addEventListener('mouseleave',()=>{this.mouse=null;this.drag=null});
    cv.addEventListener('mousedown',e=>{this.drag={x:e.clientX,off:this.offset};cv.style.cursor='grabbing'});
    window.addEventListener('mouseup',()=>{this.drag=null;cv.style.cursor=''});
    cv.addEventListener('wheel',e=>{e.preventDefault();
      this.slot=clamp(this.slot*(e.deltaY<0?1.16:1/1.16),3.2,26);
      this.offset=clamp(this.offset,0,this.maxOff());},{passive:false});
    cv.addEventListener('touchstart',e=>{if(e.touches.length===1)this.drag={x:e.touches[0].clientX,off:this.offset}},{passive:true});
    cv.addEventListener('touchmove',e=>{if(e.touches.length===1&&this.drag)
      this.offset=clamp(this.drag.off+(e.touches[0].clientX-this.drag.x)/this.slot,0,this.maxOff());},{passive:true});
    cv.addEventListener('touchend',()=>this.drag=null,{passive:true});
    this.loop=this.loop.bind(this);requestAnimationFrame(this.loop);
  }
  rs(){const p=this.cv.parentElement,d=devicePixelRatio||1;
    this.W=p.clientWidth;this.H=p.clientHeight;
    this.cv.width=Math.max(1,this.W*d);this.cv.height=Math.max(1,this.H*d);
    this.ctx.setTransform(d,0,0,d,0,0);}
  destroy(){this.dead=true;this.ro.disconnect()}
  setAsset(){this.ease=null}
  cds(){return Market.candles(Market.byId(dg(this.o.asset)),dg(this.o.tf),430)}
  maxOff(){return Math.max(0,this.cds().length-8)}
  loop(){if(this.dead)return;requestAnimationFrame(this.loop);if(this.W>40)this.draw()}
  _pill(x,y,w,h,txt,bg,fg){const c=this.ctx;rr(c,x,y,w,h,4);c.fillStyle=bg;c.fill();
    c.fillStyle=fg;c.font='600 10px "JetBrains Mono",monospace';c.textAlign='center';c.textBaseline='middle';c.fillText(txt,x+w/2,y+h/2+.5)}
  draw(){
    const c=this.ctx,W=this.W,H=this.H,comp=this.o.compact;
    const a=Market.byId(dg(this.o.asset)),tf=dg(this.o.tf);
    const cds=this.cds();if(!a||cds.length<2){c.clearRect(0,0,W,H);return}
    const padR=comp?58:64,padB=comp?6:22,padT=comp?10:14,padL=0;
    const pw=W-padL-padR,ph=H-padT-padB;
    const fut=8;
    const off=this.offset=clamp(this.offset,0,Math.max(0,cds.length-6));
    const vis=clamp(Math.floor(pw/this.slot),6,cds.length);
    const view=cds.slice(Math.max(0,cds.length-vis-off));
    if(view.length<2)return;
    let hi=-1e18,lo=1e18;for(const k of view){if(k.h>hi)hi=k.h;if(k.l<lo)lo=k.l}
    const rg=(hi-lo)||a.price*0.001;hi+=rg*.07;lo-=rg*.07;
    const Y=p=>padT+(hi-p)/(hi-lo)*ph;
    const rightX=padL+pw;
    const X=i=>rightX-fut*this.slot-(view.length-1-i)*this.slot-this.slot*.5;
    const anchor=view[view.length-1].t;
    const xT=t=>rightX-fut*this.slot-((anchor-t)/(tf*1000)+.5)*this.slot;
    c.clearRect(0,0,W,H);c.textBaseline='middle';c.lineWidth=1;
    const stp=niceStep((hi-lo)/(comp?3.2:5));
    c.font='10px "JetBrains Mono",monospace';
    for(let p=Math.ceil(lo/stp)*stp;p<hi;p+=stp){const y=Y(p);
      c.strokeStyle=CC.gridS;c.beginPath();c.moveTo(padL,y);c.lineTo(rightX,y);c.stroke();
      if(!comp){c.fillStyle=CC.dim;c.textAlign='left';c.fillText(Market.fmtP(a,p),rightX+7,y);}}
    if(!comp){const k=Math.max(1,Math.ceil(76/this.slot));c.textAlign='center';
      for(let i=view.length-1;i>=0;i--){const k2=view[i];
        if(k2.t%(k*tf*1000)!==0)continue;const x=X(i);
        c.strokeStyle=CC.gridS;c.beginPath();c.moveTo(x,padT);c.lineTo(x,padT+ph);c.stroke();
        c.fillStyle=CC.dim;const d=new Date(k2.t);
        c.fillText(tf<60?d.toTimeString().slice(3,8):d.toTimeString().slice(0,5),x,H-9);}
      const gx=rightX-fut*this.slot;c.strokeStyle=CC.grid;c.setLineDash([3,4]);
      c.beginPath();c.moveTo(gx,padT);c.lineTo(gx,padT+ph);c.stroke();c.setLineDash([]);}
    if(dg(this.o.mode)==='line'){
      c.beginPath();view.forEach((k,i)=>{const x=X(i);i?c.lineTo(x,Y(k.c)):c.moveTo(x,Y(k.c))});
      c.strokeStyle=CC.acc;c.lineWidth=1.6;c.stroke();
      c.lineTo(X(view.length-1),padT+ph);c.lineTo(X(0),padT+ph);c.closePath();
      c.fillStyle='rgba(205,255,63,.055)';c.fill();c.lineWidth=1;
    }else{
      const bw=Math.max(1,this.slot*.62);
      for(let i=0;i<view.length;i++){const k=view[i],x=X(i),up=k.c>=k.o,col=up?CC.up:CC.down;
        c.strokeStyle=col;c.beginPath();c.moveTo(x,Y(k.h));c.lineTo(x,Y(k.l));c.stroke();
        c.fillStyle=col;const y1=Y(Math.max(k.o,k.c)),y2=Y(Math.min(k.o,k.c));
        c.fillRect(x-bw/2,y1,bw,Math.max(1,y2-y1));}}
    for(const t of (dg(this.o.trades)||[])){
      const col=t.dir==='up'?CC.up:CC.down,ey=Y(t.entry);
      if(ey>padT&&ey<padT+ph){
        c.strokeStyle=col;c.setLineDash([5,4]);c.beginPath();c.moveTo(padL,ey);c.lineTo(rightX,ey);c.stroke();c.setLineDash([]);
        const lab=(t.dir==='up'?'▲ ':'▼ ')+money(t.amount);
        c.font='600 10px "JetBrains Mono",monospace';const w=c.measureText(lab).width+12;
        c.fillStyle=col;rr(c,padL+6,ey-9,w,18,4);c.fill();
        c.fillStyle=CC.bg;c.textAlign='left';c.fillText(lab,padL+12,ey);}
      const ex=xT(t.expiry);
      if(ex>padL&&ex<rightX){
        c.strokeStyle=col;c.setLineDash([4,4]);c.beginPath();c.moveTo(ex,padT);c.lineTo(ex,padT+ph);c.stroke();c.setLineDash([]);
        const lab=count(t.expiry-Date.now());
        c.font='600 10px "JetBrains Mono",monospace';const w=c.measureText(lab).width+10;
        c.fillStyle=CC.bg;rr(c,ex-w/2,padT+2,w,16,4);c.fill();c.stroke();
        c.fillStyle=col;c.textAlign='center';c.fillText(lab,ex,padT+10);}}
    if(off===0){
      const lp=a.price;this.ease=this.ease==null?lp:this.ease+(lp-this.ease)*.18;
      const y=Y(clamp(this.ease,lo,hi)),col=a.dir>=0?CC.up:CC.down;
      c.strokeStyle=col;c.setLineDash([4,4]);c.beginPath();c.moveTo(padL,y);c.lineTo(rightX,y);c.stroke();c.setLineDash([]);
      const txt=Market.fmtP(a);c.font='600 10.5px "JetBrains Mono",monospace';
      const w=c.measureText(txt).width+12;
      c.fillStyle=col;rr(c,rightX+2,y-9,w,18,4);c.fill();
      c.fillStyle=CC.bg;c.textAlign='left';c.fillText(txt,rightX+8,y);}
    for(const p of (dg(this.o.pulses)||[])){
      const age=(performance.now()-p.at)/950;if(age>=1)continue;
      const x=xT(p.time),y=Y(p.price);
      c.globalAlpha=(1-age)*.9;c.strokeStyle=p.win?CC.up:CC.down;c.lineWidth=2;
      c.beginPath();c.arc(x,y,4+age*30,0,7);c.stroke();c.lineWidth=1;c.globalAlpha=1;}
  }
}

async function hashPw(p){
  if(crypto&&crypto.subtle){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('vanta·'+p));
    return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
  let h=5381;for(const ch of 'vanta·'+p)h=((h<<5)+h+ch.charCodeAt(0))>>>0;return 'x'+h.toString(16);
}
const DEMO_ADDR={usdt:'TXk9rWv7Qm4LdPgY2nB8sJcFeA6hUuZ3Rk',btc:'bc1qxw9v2l7mecf83jan5h0ptds46yugk9rw2m8ha7',eth:'0x7F9a2C4eB81d05A6f3E8c92B47aD1365F80b3De9'};
const Demo={
  latency:v=>sleep(320+Math.random()*380).then(()=>v),
  fail(m){throw new Error(m)},
  pub(u){return{id:u.id,name:u.name,email:u.email,createdAt:u.createdAt,wallets:u.wallets}},
  async register({name,email,password}){
    email=email.trim().toLowerCase();
    if(Object.values(DB.data.users).some(u=>u.email===email))this.fail('An account with this email already exists');
    const u={id:uid(),name:name.trim(),email,hash:await hashPw(password),createdAt:Date.now(),wallets:{demo:10000,real:0}};
    DB.data.users[u.id]=u;const token=uid();DB.data.sessions[token]=u.id;DB.save();
    return this.latency({token,user:this.pub(u)});
  },
  async login({email,password}){
    email=email.trim().toLowerCase();
    const u=Object.values(DB.data.users).find(x=>x.email===email);
    if(!u||u.hash!==await hashPw(password))this.fail('Wrong email or password');
    const token=uid();DB.data.sessions[token]=u.id;DB.save();
    return this.latency({token,user:this.pub(u)});
  },
  me(id){const u=DB.user(id);if(!u)this.fail('Session expired');return this.latency(this.pub(u))},
  assets(){return this.latency(FEED.map(({id,name,cat,dec,payout})=>({id,name,cat,dec,payout})))},
  credit(id,acc,v){const u=DB.user(id);u.wallets[acc]=Math.round((u.wallets[acc]+v)*100)/100;DB.save();Bus.emit('wallet')},
  async placeTrade(id,p){
    if(p.kind&&p.kind!=='updown')this.fail('Digits & Accumulators need the live server (USE_DEMO=false)');
    const a=Market.byId(p.asset),u=DB.user(id);const amount=Math.round(p.amount*100)/100;
    if(!a)this.fail('Unknown asset');
    if(!['up','down'].includes(p.dir))this.fail('Bad direction');
    if(!(amount>=1))this.fail('Minimum stake is $1.00');
    if(amount>u.wallets[p.account])this.fail('Insufficient balance');
    this.credit(id,p.account,-amount);
    const t={id:uid(),asset:p.asset,dir:p.dir,kind:'updown',amount,account:p.account,payout:a.payout,
      entry:a.price,entryTime:Date.now(),expiry:Date.now()+p.expirySec*1000,status:'open'};
    DB.trades(id).unshift(t);DB.save();Bus.emit('trades');
    return this.latency(t);

  syncTrades(id){
    const closed=[];
    for(const t of DB.trades(id)){
      if(t.status!=='open'||Date.now()<t.expiry)continue;
      const a=Market.byId(t.asset),close=a.price;
      let result=t.dir==='up'?(close>t.entry?'win':'loss'):(close<t.entry?'win':'loss');
      if(close===t.entry)result='draw';
      t.close=close;t.closeTime=Date.now();t.status='closed';t.result=result;
      if(result==='win'){t.profit=+(t.amount*t.payout/100).toFixed(2);this.credit(id,t.account,+(t.amount+t.profit).toFixed(2));}
      else if(result==='draw'){t.profit=0;this.credit(id,t.account,t.amount);}
      else t.profit=-t.amount;
      closed.push(t);
    }
    if(closed.length){DB.save();Bus.emit('trades')}
    return Promise.resolve({closed,open:DB.trades(id).filter(t=>t.status==='open')});
  },
  listTrades(id){return this.latency(DB.trades(id).slice(0,150))},

    const rates={WELCOME20:.20,BOOST50:.50};let bonus=0;const code=(bonusCode||'').trim().toUpperCase();
    if(code){if(!rates[code])this.fail('Promo code is not valid');
      if(code==='BOOST50'&&amount<100)this.fail('BOOST50 needs a minimum of $100.00');
      bonus=+(amount*rates[code]).toFixed(2);}
    const total=+(amount+bonus).toFixed(2);
    const d={id:uid(),type:'deposit',method,amount,bonus,total,bonusCode:code||null,status:'awaiting_payment',time:Date.now(),
      instructions:method==='card'?{gateway:'sandbox'}

        :{address:DEMO_ADDR[method],network:method==='usdt'?'TRON · TRC-20':method==='btc'?'Bitcoin':'Ethereum · ERC-20'}};
    DB.tx(id).unshift(d);DB.save();Bus.emit('tx');

      this.credit(id,'real',d.total);Bus.emit('tx')},5000);

  async completeDeposit(id2,depId){

    amount=Math.round(amount*100)/100;

    const fee=method==='card'?+(amount*0.015).toFixed(2):flat[method];
    const total=+(amount+fee).toFixed(2);
    if(!flat[method]&&method!=='card')this.fail('Pick a payout method');
    if(!(amount>=10))this.fail('Minimum withdrawal is $10.00');
    let addr=address.trim();
    if(method==='mpesa'){let d2=addr.replace(/\D/g,'');
      if(d2.startsWith('0'))d2='254'+d2.slice(1);
      if(d2.length===9&&/^[17]/.test(d2))d2='254'+d2;
      if(!/^254(7|1)\d{8}$/.test(d2))this.fail('Enter a valid Safaricom number');
      addr=d2;}
    if(total>u.wallets.real)this.fail('Amount + fee exceeds your real balance');
    if(method!=='mpesa'){
      const chk={usdt:s=>s.length>=26&&s.length<=40&&s[0]==='T',btc:s=>s.length>=26&&s.length<=62,
        eth:s=>/^0x[a-fA-F0-9]{40}$/.test(s),card:s=>/^\d{12,19}$/.test(s.replace(/\s/g,''))};
      if(!chk[method](addr))this.fail('That '+method.toUpperCase()+' address doesn\u2019t look right');}

    const w={id:uid(),type:'withdrawal',method,amount,fee,total,address:addr,status:'pending',time:Date.now()};
    DB.tx(id).unshift(w);DB.save();Bus.emit('tx');
    setTimeout(()=>{w.status='processed';w.confirmedAt=Date.now();DB.save();Bus.emit('tx')},8000);

    this._sync=setInterval(async()=>{
      if(!this.u)return;
      if(++n%7===0){try{const m=await API.me();this.u=m.user||m;Bus.emit('wallet')}catch{}}
      try{
        const r=await API.syncTrades();
        const openIds=new Set((r.open||[]).map(t=>t.id));
        Live.all=Live.all.filter(t=>t.status==='closed'||openIds.has(t.id));
        (r.open||[]).forEach(t=>{const i=Live.all.findIndex(x=>x.id===t.id);
          if(i>=0)Live.all[i]=t;else Live.all.unshift(t);});
        (r.closed||[]).forEach(t=>{
          const i=Live.all.findIndex(x=>x.id===t.id);
          if(i>=0)Live.all[i]=t;else Live.all.unshift(t);
          this.settleToast(t);
          if(!t.kind)Bus.emit('pulse',t);});
        if((r.closed||[]).length)Bus.emit('trades');
      }catch{}
    },700);
  },
};

/* ---- SCANNER ---- */
function Scanner(app){
  let rows=[];
  function analyze(){
    const out=[];
    for(const a of Market.A){
      const t=a.ticks;if(t.length<60)continue;
      const cut=t[t.length-61];
      const mom=(a.price-cut.p)/a.vol;                    /* sigma move over 60s */
      let ups=0;for(let i=t.length-30;i<t.length;i++)if(t[i].p>t[i-1].p)ups++;
      const upRatio=ups/30;
      const digs=a.ticks.slice(-20).map(k=>lastDigit(a));
      const even=digs.filter(d=>d%2===0).length/20;
      let sig='n',why='Balanced tape — no strong edge right now.';
      if(mom>=1.4){sig='up';why=`Strong upward momentum: ${mom.toFixed(1)}σ over 60s, ${Math.round(upRatio*100)}% of last 30 ticks rising.`;}
      else if(mom<=-1.4){sig='down';why=`Strong downward momentum: ${mom.toFixed(1)}σ over 60s, only ${Math.round(upRatio*100)}% of last 30 ticks rising.`;}
      else if(even>=.7){sig='dg';why=`Digit bias: ${Math.round(even*100)}% of last 20 digits were EVEN — parity has been one-sided.`;}
      else if(even<=.3){sig='dg';why=`Digit bias: ${Math.round((1-even)*100)}% of last 20 digits were ODD — parity has been one-sided.`;}
      const score=Math.round(clamp(Math.abs(mom)*22+Math.abs(even-.5)*80,4,97));
      out.push({a,mom,sig,why,score,even,
        play:sig==='up'?'UP':sig==='down'?'DOWN':sig==='dg'?(even>=.7?'EVEN':'ODD'):'—'});
    }
    out.sort((x,y)=>y.score-x.score);
    rows=out;
  }
  function drawList(){
    $('#sc-list').innerHTML=rows.map(r=>`
      <div class="scan-it">
        <div class="scan-top">
          <b>${r.a.name} <i class="pos-acc">${r.a.cat}</i></b>
          <span class="scan-sig ${r.sig}">${r.play==='—'?'NO EDGE':r.play+' · '+r.score+'%'}</span>
        </div>
        <div class="scan-bar"><i style="width:${r.score}%"></i></div>
        <div class="scan-why">${r.why}</div>
      </div>`).join('');
  }
  app.innerHTML=appHeader('scanner')+`<div class="pg narrow">
    <div class="pg-head"><h1>${icon('radar',20)} AI Scanner</h1>
      <span class="sim-tag ok" id="sc-live">● SCANNING</span></div>
    <div class="pn">
      <p class="hint" style="margin:0 0 14px">${icon('info',13)} The scanner runs a live statistical sweep of every market — momentum (σ over 60s), tick direction ratio, and last-digit parity bias — then ranks the strongest setups. <b>Probabilities, not guarantees.</b> Digital games and direction calls settle exactly the same as manual trades.</p>
      <div id="sc-list"></div>
    </div></div>`;
  wireHeader();
  analyze();drawList();
  const iv=setInterval(()=>{analyze();
    if($('#sc-list'))drawList();},4000);
  onCleanup(()=>clearInterval(iv));
  onCleanup(Market.on(()=>{
    const l=$('#sc-live');
    if(l&&!USE_DEMO){l.textContent=Market.connected?'● SCANNING':'● OFFLINE';
      l.className='sim-tag '+(Market.connected?'ok':'bad');}}));
}

    if(/trade|how|win|settle|digit|acca/.test(q))return `How trading works:\n• UP/DOWN: entry locks on your tick; if the close is past it at expiry, you win the fixed payout (82–88%)\n• Digits: the price's last digit at expiry decides — EVEN/ODD (~1.9×), OVER/UNDER, MATCH (~9.5×)\n• Accumulator: 2–5 UP/DOWN legs, all must land, payouts multiply\n\nEvery trade settles on our server.`;
    if(/demo|balance|reset/.test(q))return `Every account gets a $10,000 DEMO wallet for practice. Switch between DEMO and REAL using the wallet pill at the top. Demo resets aren't available in live mode — practice stakes come out of the same demo balance.`;
    if(/human|agent|person|help/.test(q))return `You can reach a human at support@yourdomain.com or WhatsApp +254 XXX XXX XXX (replace with your contacts in the code). I'm the automated assistant and I'm here 24/7 for everything else.`;
    return `I'm not sure about that one. Try asking about deposits, withdrawals, M-Pesa, bonuses or how trades settle — or reach a human at support@yourdomain.com.`;
  }
  function paint(){
    const box=$('#chat');
    box.innerHTML=msgs.map(m=>`<div class="msg ${m.who==='me'?'me':'bot'}">${esc(m.txt)}</div>`).join('');
    box.scrollTop=box.scrollHeight;
  }
  app.innerHTML=appHeader('support')+`<div class="pg narrow">
    <div class="pg-head"><h1>${icon('chat',20)} Support</h1>
      <span class="sim-tag ok">● ONLINE</span></div>
    <div class="pn">
      <div class="chat" id="chat"></div>
      <div class="qchips">${['How do deposits work?','M-Pesa withdrawal','Promo codes','How do digits settle?']
        .map(q=>`<button data-q="${esc(q)}">${q}</button>`).join('')}</div>
      <div class="chat-in">
        <input id="sup-in" placeholder="Type your question…" autocomplete="off">
        <button class="btn btn-acc" id="sup-go">${icon('send',16)}</button>
      </div>
      <p class="hint">${icon('info',13)} Automated assistant — instant replies 24/7. Human channel: <b>support@yourdomain.com</b> · WhatsApp <b>+254 XXX XXX XXX</b></p>
    </div></div>`;
  wireHeader();
  const inp=$('#sup-in');
  function send(txt){
    txt=(txt||inp.value).trim();if(!txt)return;
    msgs.push({who:'me',txt});
    try{localStorage.setItem(KEY,JSON.stringify(msgs))}catch{}
    paint();inp.value='';
    setTimeout(()=>{
      msgs.push({who:'bot',txt:botReply(txt)});
      try{localStorage.setItem(KEY,JSON.stringify(msgs))}catch{}
      paint();
    },700);
  }
  paint();
  $('#sup-go').onclick=()=>send();
  inp.onkeydown=e=>{if(e.key==='Enter')send()};
  $$('.qchips button',app).forEach(b=>b.onclick=()=>send(b.dataset.q));
}

      ${s.bonus?`<div class="sum-r"><span>Bonus ${s.code?'· '+esc(s.code):''}</span><b class="u-c">+${money(s.bonus)}</b></div>`:''}
      <div class="sum-r"><span>Deposit fee</span><b>$0.00</b></div>
      <div class="sum-r tot"><span>You receive</span><b>${money(s.total)}</b></div>
      ${step===1?`<button class="btn btn-acc wide" id="dep-go" style="margin-top:18px">Continue ${icon('right',15)}</button>`:''}

  function methodRows(){

      <span class="mg">${m.glyph||icon('card',18)}</span>
      <span><b>${m.name}</b><i>${m.net}</i></span>
      <span class="mnote">${m.note}</span></button>`).join('');
  }
  function depBody(){
    if(step===1)return `<div class="pn">
        <label class="tb-lab">Payment method</label>${methodRows()}
        <label class="tb-lab" style="margin-top:16px">Amount (USD) · min $${MIN_DEPOSIT.toFixed(2)}</label>
        <input id="dep-amt" inputmode="decimal" placeholder="10.00" value="${dep?dep.amount:''}">
        <div class="qchips" style="margin-bottom:14px">${[MIN_DEPOSIT,10,25,50,100].map(v=>`<button data-q="${v}">${v}</button>`).join('')}</div>
        ${method==='mpesa'?`<label class="tb-lab">M-Pesa phone number</label>
        <input id="mp-phone" inputmode="tel" placeholder="07XX XXX XXX">
        <p class="hint">You'll get a push on this number — enter your M-Pesa PIN to approve. Safaricom lines only.</p>`:''}
        <label class="tb-lab" style="margin-top:14px">Promo code <span style="text-transform:none;letter-spacing:0">(optional)</span></label>
        <input id="promo" placeholder="e.g. WELCOME20" value="${dep?dep.bonusCode||'':''}" style="text-transform:uppercase">
        <p class="hint">${icon('gift',13)} ${PROMO_HINT}</p>
      </div>${sumPanel()}`;
    if(step===2&&method==='mpesa')return `<div class="pn">
        <h3 style="margin:0 0 4px;font:600 15px var(--fd)">M-Pesa · ${money(dep.total)}</h3>
        <p class="hint" style="margin:0 0 14px">Request for <b>${esc(dep.instructions.phone)}</b>${dep.instructions.kesAmount?` · <b>KES ${dep.instructions.kesAmount.toLocaleString()}</b>`:''}.</p>
        <div id="stages"></div>
        <p class="hint" style="margin-top:14px">${icon('info',13)} Real STK Push needs Daraja wired on the backend. For testing, approve with the dev button below.</p>
        <button class="btn btn-acc wide" id="mp-sim" style="margin-top:14px">${icon('check',15)} Dev approve (test)</button>
        <button class="btn btn-ghost wide" id="mp-cancel" style="margin-top:10px">Cancel and go back</button>
      </div>${sumPanel()}`;
    if(step===2&&method!=='card')return `<div class="pn">
        <h3 style="margin:0 0 4px;font:600 15px var(--fd)">Send ${money(dep.total)} in ${method.toUpperCase()}</h3>
        <p class="hint" style="margin:0 0 14px">Network: <b>${esc(dep.instructions.network)}</b> — sending the wrong network can lose funds.</p>
        <div class="qrbox"><canvas id="qr" width="172" height="172"></canvas></div>
        <label class="tb-lab">Deposit address</label>
        <div class="addr"><code>${esc(dep.instructions.address)}</code>
          <button id="cp-addr" title="Copy">${icon('copy',15)}</button></div>
        <p class="hint" style="margin-bottom:16px">The address above is a <b>placeholder</b> until a crypto payment provider is wired. In test mode, confirm below.</p>
        <button class="btn btn-acc wide" id="sent">${icon('check',15)} I\u2019ve sent the funds</button>
      </div>${sumPanel()}`;
    if(step===2)return `<div class="pn"><h3 style="margin:0 0 14px;font:600 15px var(--fd)">Card payment · ${money(dep.total)}</h3>
        <div class="card-f">
          <div class="full"><label class="tb-lab">Card number</label><input id="c-num" inputmode="numeric" placeholder="4242 4242 4242 4242"><em class="err" id="c-num-e"></em></div>
          <div><label class="tb-lab">Expiry</label><input id="c-exp" inputmode="numeric" placeholder="MM/YY"><em class="err" id="c-exp-e"></em></div>
          <div><label class="tb-lab">CVV</label><input id="c-cvv" inputmode="numeric" placeholder="123" type="password"><em class="err" id="c-cvv-e"></em></div>
          <div class="full"><label class="tb-lab">Cardholder name</label><input id="c-name" placeholder="ALEX TRADER"><em class="err" id="c-name-e"></em></div>
        </div>
        <p class="hint" style="margin-bottom:16px">Test checkout — use <b>4242 4242 4242 4242</b>, any future expiry, any CVV.</p>
        <button class="btn btn-acc wide" id="c-pay">${icon('lock',15)} Pay ${money(dep.total)}</button>
      </div>${sumPanel()}`;
    if(phase==='done')return `<div class="pn" style="text-align:center;padding:40px 20px">
        <div class="big-check">${icon('check',30)}</div>
        <h3 style="margin:0 0 6px;font:600 18px var(--fd)">${money(dep.total)} credited</h3>
        <p class="hint" style="margin:0 0 22px">${dep.bonus?`Includes a ${money(dep.bonus)} bonus (${esc(dep.bonusCode)}). `:''}Your REAL wallet is ready.</p>
        <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap">
          <a class="btn btn-acc big" href="#/trade">${icon('zap',16)} Trade now</a>
          <button class="btn btn-ghost big" id="again">New deposit</button>
        </div></div>
      <div class="pn" style="margin-top:16px">${receiptTx()}</div>`;
    return `<div class="pn"><h3 style="margin:0 0 10px;font:600 15px var(--fd)">Processing your ${method==='card'?'card payment':'crypto deposit'}</h3>
        <div id="stages"></div>
        <p class="hint" style="margin-top:14px">${icon('info',13)} In production your payment provider\u2019s webhook drives these stages.</p>
      </div>${sumPanel()}`;
  }
  const receiptTx=()=>`<div class="sum-r"><span>Reference</span><b>${dep.id.slice(0,8).toUpperCase()}</b></div>
    <div class="sum-r"><span>Method</span><b>${method.toUpperCase()}</b></div>
    <div class="sum-r"><span>Status</span><b class="u-c">CONFIRMED</b></div>`;
  function draw(){
    app.innerHTML=appHeader('deposit')+`<div class="pg"><div class="pg-head">
      <h1>Deposit</h1>
      <div class="steps"><span class="${step>=1?'on':''}">1 · METHOD</span><span class="${step>=2?'on':''}">2 · PAYMENT</span><span class="${step>=3?'on':''}">3 · CONFIRM</span></div></div>
      <div class="dep-grid">${depBody()}</div></div>`;
    wireHeader();wire();
  }
  const STAGES_CRYPTO=['Awaiting your payment','Transaction seen on network','1 / 3 confirmations','2 / 3 confirmations','Credited to REAL wallet'];
  const STAGES_CARD=['Contacting gateway','3-D Secure check','Approving payment','Crediting REAL wallet'];
  function setStages(names,idx){
    $('#stages').innerHTML=names.map((n,i)=>`<div class="stg ${i<idx?'done':i===idx?'run':''}">
      ${icon(i<idx?'check':'clock',15)}<span>${n}</span>${i===idx?'<i class="spin"></i>':''}</div>`).join('');
  }
  async function runStages(names,gap){
    for(let i=0;i<names.length;i++){setStages(names,i);await sleep(gap)}
  }
  const creditAndDone=d=>{dep=d;if(!USE_DEMO)Auth.bump('real',d.total);
    toast('ok',`Deposited ${money(d.total)}`,'Credited to your REAL wallet.');
    phase='done';draw();};
  function wire(){
    const body=$('.dep-grid');
    if(step===1){
      $$('.mrow',body).forEach(b=>b.onclick=()=>{method=b.dataset.m;draw()});
      $$('.qchips',body).forEach(b=>b.onclick=()=>{$('#dep-amt').value=b.dataset.q});
      $('#dep-go').onclick=async()=>{
        const s=summary();
        if(!(s.amt>=MIN_DEPOSIT))return toast('warn','Amount too small','Minimum deposit is $'+MIN_DEPOSIT.toFixed(2)+'.');
        if(s.amt>100000)return toast('warn','Amount too large','Maximum deposit is $100,000.00.');
        if(s.note)return toast('warn','Promo not applied',s.note);
        const go=$('#dep-go');go.classList.add('busy');
        let phone=null;
        if(method==='mpesa'){phone=normPhone($('#mp-phone')?.value);
          if(!/^254(7|1)\d{8}$/.test(phone)){go.classList.remove('busy');
            return toast('warn','Check the number','Enter a valid Safaricom number, e.g. 0712 345 678.');}}
        try{dep=await API.createDeposit({method,amount:s.amt,bonusCode:s.code,phone});
          if(method==='mpesa')phase='proc';
          step=2;draw();
        }catch(e){toast('warn','Could not create deposit',e.message);go.classList.remove('busy')}
      };
    }else if(step===2&&method==='mpesa'){
      $('#mp-cancel').onclick=()=>{step=1;dep=null;phase='form';draw()};
      const stages=['Request sent to Safaricom','Waiting for your M-Pesa PIN','Crediting REAL wallet'];
      const setS=i=>{const el=$('#stages');if(!el)return;el.innerHTML=stages.map((n,j)=>
        `<div class="stg ${j<i?'done':j===i?'run':''}">${icon(j<i?'check':'clock',15)}<span>${n}</span>${j===i?'<i class="spin"></i>':''}</div>`).join('')};
      (async()=>{
        setS(1);
        for(let i=0;i<40;i++){
          await sleep(3000);
          if(phase!=='proc'||!$('#stages'))return;
          let d;try{d=await API.getDeposit(dep.id)}catch{continue}
          if(d.status==='confirmed'){setS(3);await sleep(600);
            if(phase!=='proc')return;creditAndDone(d);return}
          if(d.status==='failed'&&$('#stages')){$('#stages').innerHTML=
            `<div class="stg" style="color:var(--down)">${icon('warn',15)}<span>Payment was cancelled or failed — nothing was charged.</span></div>`;return}
        }
        if($('#stages'))$('#stages').innerHTML=
          `<div class="stg" style="color:var(--down)">${icon('warn',15)}<span>Timed out after 2 minutes — no payment received.</span></div>`;
      })();
      $('#mp-sim').onclick=async()=>{
        const b=$('#mp-sim');b.classList.add('busy');
        try{const d=await API.completeDeposit(dep.id);creditAndDone(d)}
        catch(e){toast('warn',e.message);b.classList.remove('busy')}
      };
    }else if(step===2&&method!=='card'){
      const cv=$('#qr');
      try{if(cv&&window.QRCode)QRCode.toCanvas(cv,dep.instructions.address,{width:172,margin:1,color:{dark:'#141610',light:'#f1ede3'}},()=>{})}
      catch{cv&&cv.parentElement.append(Object.assign(document.createElement('p'),{textContent:'QR unavailable',style:'font-size:11px'}))}
      $('#cp-addr').onclick=async()=>{try{await navigator.clipboard.writeText(dep.instructions.address);
        toast('ok','Address copied')}catch{toast('warn','Copy failed','Select the address manually.')}};
      $('#sent').onclick=async()=>{
        step=3;phase='proc';draw();
        await runStages(STAGES_CRYPTO,1300);
        try{const d=await API.completeDeposit(dep.id);creditAndDone(d)}
        catch(e){toast('warn',e.message);phase='form';step=2;draw()}
      };
    }else if(step===2){
      const num=$('#c-num'),exp2=$('#c-exp'),cvv=$('#c-cvv');
      num.oninput=()=>{num.value=num.value.replace(/\D/g,'').slice(0,16).replace(/(\d{4})(?=\d)/g,'$1 ')};
      exp2.oninput=()=>{let v=exp2.value.replace(/\D/g,'').slice(0,4);exp2.value=v.length>2?v.slice(0,2)+'/'+v.slice(2):v};
      cvv.oninput=()=>{cvv.value=cvv.value.replace(/\D/g,'').slice(0,4)};
      $('#c-pay').onclick=async()=>{
        const d=num.value.replace(/\s/g,'');let ok=true;
        const err=(id,m)=>{$('#'+id+'-e').textContent=m;if(m)ok=false};
        err('c-num',d.length===16&&luhn(d)?'':'Check the card number');
        err('c-exp',/^(0[1-9]|1[0-2])\/\d{2}$/.test(exp2.value)?'':'Use MM/YY');
        err('c-cvv',cvv.value.length>=3?'':'3–4 digits');
        err('c-name',$('#c-name').value.trim().length>=2?'':'Cardholder name required');
        if(!ok)return;
        const b=$('#c-pay');b.classList.add('busy');
        step=3;phase='proc';draw();
        await runStages(STAGES_CARD,1400);
        try{const d=await API.completeDeposit(dep.id);creditAndDone(d)}
        catch(e){toast('warn',e.message);phase='form';step=2;draw()}
      };
    }else if(phase==='done'){
      const ag=$('#again');if(ag)ag.onclick=()=>{step=1;dep=null;phase='form';draw()};
    }
  }
  draw();
}

  function wireForm(){
    $$('.mrow',$('#w-body')).forEach(b=>b.onclick=()=>{method=b.dataset.m;draw()});
    $$('.qchips button[data-q]').forEach(b=>b.onclick=()=>{$('#w-amt').value=b.dataset.q;calc()});
    $('#w-max').onclick=()=>{
      const bal=Auth.u.wallets.real;
      $('#w-amt').value=Math.max(0,Math.floor((method==='card'?bal/1.015:bal-feeOf(method))*100)/100);calc();};
    const calc=()=>{const a=parseFloat($('#w-amt').value)||0,f=feeOfAmt(a);
      $('#w-fee').textContent=money(f);
      $('#w-net').textContent=money(Math.max(0,a-f));
      const kes=$('#w-kes');if(kes)kes.textContent='KES '+Math.ceil((a-f)*KES_PER_USD).toLocaleString();};
    $('#w-amt').oninput=calc;calc();
    $('#w-go').onclick=async()=>{
      const a=parseFloat($('#w-amt').value)||0,addr=$('#w-addr').value.trim(),f=feeOfAmt(a);
      if(!(a>=10))return toast('warn','Too small','Minimum withdrawal is $10.00.');
      const okY=await confirmDialog({title:'Confirm withdrawal',danger:true,ok:'Send it',
        body:`Send <b>${money(a)}</b> via ${method.toUpperCase()}${method==='mpesa'?` (≈ KES ${Math.ceil((a-f)*KES_PER_USD).toLocaleString()})`:''}<br>To: <b style="word-break:break-all">${esc(addr)}</b><br><br>Fee <b>${money(f)}</b> · you receive <b>${money(a-f)}</b>. This can\u2019t be reversed.`});
      if(!okY)return;
      try{wd=await API.createWithdrawal({method,address:addr,amount:a});
        if(!USE_DEMO)Auth.bump('real',-wd.total);
        toast('ok','Withdrawal submitted',`${money(wd.total)} deducted (amount + fee).`);
        phase='track';draw();
      }catch(e){toast('warn','Withdrawal rejected',e.message)}
    };
  }
  draw();
}

async function History(app){
  app.innerHTML=appHeader('history')+`<div class="pg"><div class="pg-head"><h1>History</h1>
    <div class="chips" id="h-tabs"><button data-t="trades" class="on">Trades</button><button data-t="tx">Transactions</button></div></div>
    <div class="pn" id="h-body"><div class="empty">${icon('clock',22)}<p>Loading…</p></div></div></div>`;
  wireHeader();
  const trades=await API.listTrades(),txs=await API.listTx();
  let tab='trades';
  function draw(){
    const b=$('#h-body');
    if(tab==='trades'){
      b.innerHTML=trades.length?`<table class="tbl">
        <tr><th>Time</th><th>Market</th><th>Play</th><th>Stake</th><th>Entry → Close</th><th>Result</th></tr>
        ${trades.map(t=>{const a=Market.byId(t.asset)||{name:t.asset,dec:2};
          const open=t.status==='open';
          const ent=t.kind==='digits'?'digit '+t.entry:t.kind==='acc'?'—':Market.fmtP(a,t.entry);
          const cl=t.kind==='digits'?'digit '+t.close:open?'…':t.kind==='acc'?'—':Market.fmtP(a,t.close);
          return `<tr><td class="mono" style="font-size:11px">${fmtDT(t.entryTime)}</td>
          <td><b>${a.name}</b> <i class="pos-acc">${t.account.toUpperCase()}</i></td>
          <td><b style="font-size:11px">${tradeLabel(t)}</b></td>
          <td class="mono">${money(t.amount)}</td>
          <td class="mono" style="font-size:11px">${ent} → ${cl}</td>
          <td>${open?'<span class="badge open">OPEN</span>':
            `<span class="badge ${t.result}">${t.result==='win'?'+'+money(t.profit):t.result==='draw'?'REFUND':'−'+money(t.amount)}</span>`}</td></tr>`}).join('')}
        </table>`
      :`<div class="empty">${icon('chart',24)}<p>No trades yet</p><span>Place your first call from the terminal.</span></div>`;
    }else{
      b.innerHTML=txs.length?`<table class="tbl">
        <tr><th>Time</th><th>Type</th><th>Method</th><th>Amount</th><th>Status</th></tr>
        ${txs.map(x=>`<tr><td class="mono" style="font-size:11px">${fmtDT(x.time)}</td>
          <td><b>${x.type==='deposit'?'DEPOSIT':'WITHDRAWAL'}</b>${x.bonus?` <i class="pos-acc">+${x.bonusCode}</i>`:''}</td>
          <td>${x.method.toUpperCase()}</td>
          <td class="mono ${x.type==='deposit'?'u-c':'d-c'}">${x.type==='deposit'?'+':'−'}${money(x.total)}</td>
          <td><span class="badge ${x.status==='confirmed'||x.status==='processed'?'done':'pend'}">${x.status.replace('_',' ').toUpperCase()}</span></td></tr>`).join('')}
        </table>`
      :`<div class="empty">${icon('wallet',24)}<p>No transactions yet</p><span>Deposits and withdrawals land here.</span></div>`;
    }
  }
  $$('#h-tabs button').forEach(btn=>btn.onclick=()=>{tab=btn.dataset.t;
    $$('#h-tabs button').forEach(x=>x.classList.toggle('on',x===btn));draw()});
  draw();
}

async function Profile(app){
  app.innerHTML=appHeader('profile')+`<div class="pg"><div class="pg-head"><h1>Profile</h1></div>
    <div class="prof"><div class="pn">
      <div class="prof-id"><div class="prof-av">${esc(Auth.u.name.trim().slice(0,1).toUpperCase())}</div>
        <div><b style="font-size:15px">${esc(Auth.u.name)}</b><br><span style="font-size:12px;color:var(--mut)">${esc(Auth.u.email)}</span></div></div>
      <div class="sum-r"><span>User ID</span><b style="font-size:11px;cursor:pointer" id="p-id">${Auth.u.id.slice(0,14)}…</b></div>
      <div class="sum-r"><span>Member since</span><b>${new Date(Auth.u.createdAt).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'})}</b></div>
      <button class="btn btn-ghost wide" id="p-out" style="margin-top:16px">${icon('logout',15)} Log out</button>
    </div>
    <div style="display:flex;flex-direction:column;gap:16px">
      <div class="pn"><label class="tb-lab">Wallets</label>
        <div class="sum-r"><span><span class="wp-tag d">DEMO</span>&nbsp; practice balance</span><b>${money(Auth.u.wallets.demo)}</b></div>
        <div class="sum-r"><span><span class="wp-tag r">REAL</span>&nbsp; deposited funds</span><b>${money(Auth.u.wallets.real)}</b></div>
        <a class="btn btn-acc sm" href="#/deposit" style="margin-top:14px">${icon('plus',14)} Deposit from $${MIN_DEPOSIT.toFixed(2)}</a></div>
      <div class="pn"><label class="tb-lab">Last 150 trades</label><div class="stat-grid" id="p-stats">
        <div class="stat"><span>Closed trades</span><b id="ps-n">…</b></div>
        <div class="stat"><span>Win rate</span><b id="ps-w">…</b></div>
        <div class="stat"><span>Net P/L</span><b id="ps-p">…</b></div>
        <div class="stat"><span>Volume</span><b id="ps-v">…</b></div></div></div>
    </div></div></div>`;
  wireHeader();
  $('#p-out').onclick=()=>Auth.logout();
  $('#p-id').onclick=async()=>{try{await navigator.clipboard.writeText(Auth.u.id);toast('ok','User ID copied')}catch{}};
  const trades=await API.listTrades().then(t=>t.filter(x=>x.status==='closed'));
  const w=trades.filter(t=>t.result==='win').length;
  const pl=trades.reduce((s,t)=>s+t.profit,0),vol=trades.reduce((s,t)=>s+t.amount,0);
  $('#ps-n').textContent=trades.length;
  $('#ps-w').textContent=(trades.length?Math.round(w/trades.length*100):0)+'%';
  const pe=$('#ps-p');pe.textContent=(pl>=0?'+':'−')+money(Math.abs(pl)).slice(1);pe.className=pl>=0?'u-c':'d-c';
  $('#ps-v').textContent=money(vol);
}

const routes={'/':Landing,'/login':Login,'/register':Register,'/trade':Terminal,'/digits':Digits,
  '/acca':Acca,'/scanner':Scanner,'/support':Support,
  '/deposit':Deposit,'/withdraw':Withdraw,'/history':History,'/profile':Profile};
const guarded=['/trade','/digits','/acca','/deposit','/withdraw','/history','/profile'];
function render(){
  cleanups.forEach(f=>{try{f()}catch{}});cleanups=[];
  const path=(location.hash||'#/').slice(1).split('?')[0];
  if(guarded.includes(path)&&!Auth.u){
    toast('warn','Log in to continue','That page needs an account.');
    location.hash='#/login';return;
  }
  window.scrollTo(0,0);
  const app=$('#app');app.innerHTML='';
  (routes[path]||Landing)(app);
}
window.addEventListener('hashchange',render);
(async function boot(){
  try{await Auth.boot();render();}
  catch(e){document.body.innerHTML='<pre style="color:#F04B5D;padding:20px;font-family:monospace;white-space:pre-wrap">Startup error:\n'+e+'</pre>';}
})();
</script>
